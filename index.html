:root{
  --bg:#e9eeec; --surface:#f8faf9; --ink:#14201d; --muted:#586661; --line:#cfd9d5;
  --green:#0f4c45; --green-ink:#ffffff; --gold:#9a7424; --gold-soft:#efe5cc; --note:#e3ede9;
  --ar:#0d1a17;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1311; --surface:#161d1a; --ink:#e6ece9; --muted:#9aa8a2; --line:#27312d;
    --green:#3fa392; --green-ink:#06120f; --gold:#d3ab55; --gold-soft:#2a2414; --note:#1a2420;
    --ar:#f2f5f3;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1311; --surface:#161d1a; --ink:#e6ece9; --muted:#9aa8a2; --line:#27312d;
  --green:#3fa392; --green-ink:#06120f; --gold:#d3ab55; --gold-soft:#2a2414; --note:#1a2420;
  --ar:#f2f5f3;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

/* top bar */
header.top{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  border-bottom:1px solid var(--line);padding:10px 0 10px;
}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-weight:700;letter-spacing:.01em}
.tools{display:flex;gap:6px}
.chip{
  background:var(--surface);border:1px solid var(--line);border-radius:999px;
  padding:6px 12px;font-size:.85rem;font-weight:600;min-height:36px;
}
.chip[aria-pressed="true"]{background:var(--green);color:var(--green-ink);border-color:var(--green)}
.phases{display:flex;gap:4px;margin-top:10px}
.phases span{flex:1;height:6px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.phases span i{position:absolute;inset:0;background:var(--gold);transform-origin:left;transform:scaleX(0);transition:transform .25s}
.phases span.done i{transform:scaleX(1)}
.phase-label{margin-top:6px;font-size:.82rem;color:var(--muted);display:flex;justify-content:space-between}

/* home */
.home{padding:28px 0 40px}
.home h1{font-size:2rem;line-height:1.15;margin:8px 0 6px}
.home p.sub{color:var(--muted);margin:0 0 22px}
.mark{
  font-family:Amiri,"Traditional Arabic",serif;font-size:2.6rem;color:var(--gold);line-height:1.1;margin:0;
}
fieldset{border:0;margin:0 0 18px;padding:0}
legend{font-weight:700;margin-bottom:8px;padding:0}
.opt{display:grid;gap:8px}
.opt label{
  display:block;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;
}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt label:has(input:checked){border-color:var(--green);background:var(--note)}
.opt label:has(input:focus-visible){outline:3px solid var(--gold);outline-offset:2px}
.opt b{display:block}
.opt small{color:var(--muted)}
.btn{
  display:block;width:100%;border:0;border-radius:14px;padding:15px 18px;font-weight:700;font-size:1.05rem;
  background:var(--green);color:var(--green-ink);min-height:52px;
}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.fine{font-size:.85rem;color:var(--muted);margin-top:16px}

/* step */
main{padding:18px 0 215px}
.eyebrow{color:var(--gold);font-weight:600;font-size:.9rem;margin:0}
h1.t{font-size:1.65rem;line-height:1.2;margin:2px 0 6px}
.lead{color:var(--muted);margin:0 0 16px}
h2.s{font-size:1rem;margin:20px 0 8px}
ol.do{margin:0;padding:0;list-style:none;counter-reset:a;display:grid;gap:8px}
ol.do li{
  counter-increment:a;background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:11px 14px 11px 46px;position:relative;
}
ol.do li::before{
  content:counter(a);position:absolute;left:12px;top:11px;width:24px;height:24px;border-radius:50%;
  background:var(--green);color:var(--green-ink);font-weight:700;font-size:.8rem;display:grid;place-items:center;
}
.dua{
  background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--gold);
  border-radius:12px;padding:14px 14px 12px;margin:0 0 12px;
}
.dua h3{margin:0 0 8px;font-size:.95rem}
.ar{
  font-family:Amiri,"Traditional Arabic","Scheherazade New",serif;direction:rtl;text-align:right;
  font-size:calc(1.55rem * var(--fs,1));line-height:2.1;margin:0;color:var(--ar);
}
.tr{margin:8px 0 0;font-style:italic;font-size:calc(1rem * var(--fs,1));color:var(--ink)}
body.no-tr .tr{display:none}
.dnote{margin:8px 0 0;font-size:.88rem;color:var(--muted)}
.note{background:var(--note);border-radius:12px;padding:11px 14px;margin:0 0 10px;font-size:.95rem}
.note b{color:var(--green)}
.rounds{display:flex;gap:6px;margin:0 0 14px}
.rounds i{flex:1;height:10px;border-radius:5px;background:var(--line)}
.rounds i.on{background:var(--gold)}
.rounds i.now{background:var(--green)}

/* bottom bar */
footer.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);
  padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));
}
.bar .wrap{display:grid;grid-template-columns:auto 1fr;gap:10px}
.bar .btn.ghost{width:auto;padding:15px 18px}

/* overlay */
.sheet{
  position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:none;
}
.sheet.open{display:block}
.sheet .panel{
  position:absolute;left:0;right:0;bottom:0;max-height:82%;overflow:auto;background:var(--bg);
  border-radius:18px 18px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));
}
.panel h2{margin:4px 0 10px;font-size:1.15rem}
.list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.list button{
  width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;font-size:.95rem
}
.list button[aria-current="step"]{border-color:var(--green);background:var(--note);font-weight:700}
.list .grp{font-size:.8rem;color:var(--muted);margin:10px 2px 2px;font-weight:600}
.list button.past{opacity:.6}

.finish{text-align:center;padding:30px 0}
.finish .mark{font-size:3rem}

@media (prefers-reduced-motion: reduce){ .phases span i{transition:none} }
.audio{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.audio .chip,.listenall{cursor:pointer}
.chip.play.on,.listenall.on{background:var(--green);color:var(--green-ink)}
.amsg{font-size:.9rem;color:var(--muted);margin:8px 0 0}
.tag{font-size:.8rem;color:var(--green);font-weight:600}
.dhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}

.secard{display:block;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:20px 18px;margin:0 0 14px}
.secard b{display:block;font-size:1.5rem;margin-bottom:4px}
.secard .ar2{font-family:Amiri,"Traditional Arabic",serif;color:var(--gold);font-size:1.6rem;float:right;line-height:1}
.secard small{color:var(--muted);font-size:.95rem}
.secard:active,.secard:focus-visible,.bkcard:active,.bkcard:focus-visible{border-color:var(--green)}

main{padding-bottom:100px}

 عَبَدَ اللَّهَ حَتَّى أَتَاهُ الْيَقِينُ * وَاتَّقَى اللَّهَ حَقَّ تُقَاتِهِ وَكَانَ إِمَامَ الْمُتَّقِينَ * وَنَشْهَدُ أَنَّهُ بَلَّغَ رِسَالَتَهُ وَصَدَعَ أَمْرَهُ وَنَصَحَ عِبَادَهُ * وَفَتَحَ لِتَابِعِيهِ أَبْوَابَ السَّعَادَةِ * وَعَرَّفَهُمْ حُدُودَ الشَّهَادَةِ * أَسْأَلُكَ اللَّهُمَّ بِعَظِيمِ جَاهِهِ أَنْ تُنْقِذَنِي مِنَ الْخَطَاءِ وَالزَّلَلِ * وَأَنْ تُوَفِّقَنِي لِصَالِحِ الْقَوْلِ وَالْعَمَلِ * وَأَنْ تُيَسِّرَ لِي الرَّضَاعَ بِدَرِّ الْعِلْمِ * وَضَرْعِ الْفَهْمِ * وَأَنْ تُحْيِيَنِي بِغِذَاءِ الْعَقْلِ * وَتَعْصِمَنِي مِنْ سُلُوكِ سُبُلِ الْجَهْلِ * وَتُمِيطَ عَنِّي الْأَذَى * وَتُعَافِيَنِي مِنَ الْقَذَى * وَتَدْفَعَ عَنِّي بِرَحْمَتِكَ كَيْدَ مَنْ نَصَبَ لِي كَيْدَهُ * وَتُطْفِئَ عَنِّي بِرَأْفَتِكَ نَارَ مَنْ شَبَّ لِي نَارَهُ * وَتَعْصِمَنِي مِنْ ذَلِكَ بِالسَّكِينَةِ وَتُدْخِلَنِي فِي دِرْعِكَ الْحَصِينَةِ * اللَّهُمَّ وَاجْعَلْنِي مِنْ سُجُونِ الْمِحَنِ خَارِجًا * وَفِي حُصُونِ السَّلَامَةِ وَالْجَاءِ * اللَّهُمَّ إِنِّي أَعُوذُ بِكَ وَبِكَلِمَاتِكَ التَّامَّةِ * مِنْ شَرِّ كُلِّ ذِي شَرٍّ * وَضُرِّ كُلِّ ذِي ضُرٍّ * اللَّهُمَّ إِنَّا بِرَجَاءٍ لَا يَشُوبُهُ قُنُوطٌ * وَمَعَادٍ لَا يَعْتَرِضُهُ سُقُوطٌ * وَنِعَمٍ لَا يَعْتَوِرُهَا قُحُوطٌ * إِنَّكَ عَلَى كُلِّ شَيْءٍ مُحِيطٌ * اللَّهُمَّ أَعْطِنَا مَعِيشَةَ السُّعَدَاءِ * وَمَنْزِلَةَ الشُّهَدَاءِ * وَابْسُطْنَا فِيمَا نُحِبُّ وَنَرْضَى * وَاقْبِضْنَا عَمَّا نَهَيْتَ عَنْهُ قَبْضًا * وَاكْفِنَا رَوْعَاتِ الْفِتَنِ وَالْقُنُوطِ * وَجَنِّبْنَا مَجَارِيَ السُّقُوطِ * اللَّهُمَّ لَا تَجْعَلْنَا لِرَحَى الْأَشْرَارِ طَحْنًا * وَلَا بِأَيْدِي الْأَعْدَاءِ رَهْنًا * وَمَتِّعْنَا بِنِعَمٍ تَزِيدُ وَلَا تَبِيدُ * وَأَيَّامًا يَتَّصِلُ مَاضِيهَا بِالْجَدِيدِ * وَاجْعَلْنَا بِالْمَوْتِ سُعَدَاءَ * وَفِي جِهَادِ أَعْدَائِكَ شُهَدَاءَ * وَأَدْخِلْنَا فِي شَفَاعَةِ النَّبِيِّ وَزُمْرَتِهِ * وَاجْعَلْنَا مِنَ الْمُلَبِّينَ لِدَعْوَتِهِ * وَامْنُنْ عَلَيْنَا بِالنِّعَمِ الْأَمَدِيَّةِ * وَالسَّعَادَةِ الْأَبَدِيَّةِ * وَطَهِّرْ جَوَارِحَنَا مِنْ رِجْسِ الْأَبَالِسِ * وَجُنُودِهِمُ الْأَرَاجِسِ * وَاشْرُكْنَا َلَا تُشْمِتْ بِنَا أَعْدَاءَنَا * وَلَا تُسَوِّدْ وُجُوهَنَا * فَقَدْ تَشَفَّعْنَا إِلَيْكَ بِمُحَمَّدٍ وَآلِ مُحَمَّدٍ * وَتَذَرَّعْنَا إِلَيْكَ بِمُحَمَّدٍ وَآلِ مُحَمَّدٍ صَلَوَاتُكَ عَلَيْهِ وَعَلَى آلِهِ وَسَلَامُكَ *", "tr": "Allahummaj'al salawatika wa barakatika wa rahmataka wa ni'mataka wa tahiyyatika ala abdika wa rasulika wa nabiyyika wa safiyyik al-atharil-azharil-anwari Muhammadin amini wahyika wa shari'atikal-qa'imi bihujjatika ala bariyyatik * wa salli alayhi wa ala alihi afdala ma sallayta wa azkahu * wa atharahu wa anmahu * wa salli alayhi wa ala alihi fa-inna natawallahum wa natawallah * Allahummaj'al Muhammadan awwala shafi'in * wa awwala mushaffa'in * wa awwala qa'ilin * wa anjaha sa'il * akrim mathwah * wa ajzil hibah * warfa' darajatah * wansur dhurriyyatah * Allahumma la tuhbit a'malana * wa la tukhayyib amalana * wa la tushmit bina a'da'ana * wa la tusawwid wujuhana * faqad tashaffa'na ilayka bi-Muhammadin wa ali Muhammad * wa tadhara'na ilayka bi-Muhammadin wa ali Muhammad salawatuka alayhi wa ala alihi wa salamuk *", "note": "Go to the minbar, place your hand on it, face the qibla and read this dua."}], "notes": [], "finish": false, "round": 2, "total": 9, "roundLabel": "Station", "img": "data:image/webp;base64,UklGRsIBAgBXRUJQVlA4ILYBAgDQzgSdASogAzUCPmEkjUUkIiEYLH7wQAYEpnDCFdXxAvIf5D9MdbnOtu99S9wTF7+9/Z//h+2r4t+0u7qemf+CEF8S7I4lAhG0Pl+uPzvyiMe/7rtueAN1P1wf1X1AP17/13mW8wP1y+kD5JvS9/h/Qv/Lf8T6J3/A9fH+f45f2//f/tR7hblC6n8HOizP8MzW+zHT79H9pvdt/sdZnvX/T8uX2T+w+dP5sf9T1r/2P/f+xB/af876r//X+3/v0/xH/i9VX9h/5/7me6x/4/3I9+P9s/7HsWf2b/q+t//4f/p/6Pik/0X/k///urfub///aS/+P72fET/d//J+8nwofuz///YA///t7af7zx/k+B/5F9F/m/73/mf+n/gPkl+8f9//R+GD1z+h/8P+l/1nsL/Mfwz+6/wf+e/+H+a+Y38v/yv8t/q/2z9Nfix/h/43/S/tV8hH5X/SP9b/eP8n+zPw//Wf+P/Of7zwltf/zf/a/0PsEeyX1j/k/4P/Uftz7uP0v/a/zn+09m/1P/Ff9n/Nf6n9u/sC/n39l/53+L9uv+p4ln47/h/tv8An9Y/zP/0/13+4+Fb+8/+P+v/3X7v+7b9F/1X/u/03+6+Q3+ff33/wf5T/UftzyZSfY2fVQBe+L/tGFL/aiOjXxdz4GvUSz4rTfXthLZrVSxD0JQ56ba0BTeWHrEl5mq38ti8igwVMGx/Obv na * Allahumma askin qulubana khawfak * wa ash'irna khashyatak * wa alhimna an nashkura ni'matak * wa asbigh alayna ni'matak * wa baghghid ilayna ma'siyatak * wa habbib ilayna ta'atak ya arhamar-rahimin *", "note": ""}], "notes": [], "finish": false, "round": 3, "total": 9, "roundLabel": "Station"}, {"phase": 5, "title": "Balagh 4 of 9: Ustuwana Hannana", "lead": "The weeping pillar.", "actions": ["Go to Ustuwana Hannana and pray two rak'at with this niyyah.", "After the salam, read the dua."], "duas": [{"title": "Niyyah for 2 rak'at", "ar": "أُصَلِّي صَلَاةً لِلِاشْتِيَاقِ إِلَى رَحْمَةِ اللَّهِ تَعَالَى رَكْعَتَيْنِ لِلَّهِ عَزَّ وَجَلَّ أَدَاءً مُسْتَقْبِلَ الْكَعْبَةِ الْحَرَامِ اللَّهُ أَكْبَرُ *", "tr": "Usalli salatan lil-ishtiyaqi ila rahmatillahi ta'ala rak'atayni lillahi azza wa jall ada'an mustaqbilal-ka'batil-haram Allahu akbar *", "note": "Go to Ustuwana Hannana (the weeping pillar) and pray two rak'at."}, {"title": "Dua after the salam", "ar": "اللَّهُمَّ اهْدِنَا بِهُدَاكَ * وَأَحْسِنِ اعْتِقَادَنَا بِبَقَاكَ * وَخُذْ بِنَوَاصِينَا إِلَى رِضَاكَ * وَنَوِّرْ قُلُوبَنَا بِنُورِ الْيَقِينِ * وَهَبْ لَنَا مِنْ بَصَائِرِ الْمُسْتَبْصِرِينَ * وَاحْشُرْنَا عَلَى طَاعَتِكَ يَوْمَ الدِّينِ * وَطَاعَةِ وَلِيِّكَ الْإِمَامِ أَبِي الْقَاسِمِ أَمِيرِ الْمُؤْمِنِينَ * مُسْتَمْسِكِينَ بِالْحَبْلِ الْمَتِينِ * وَبِالْعُرْوَةِ الَّتِي لَا انْفِصَامَ لَهَا مِنَ الْمُعْتَصِمِينَ * اللَّهُمَّ آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَجَمِيعَ الْمُؤْمِنِينَ * إِنَّكَ أَنْتَ الْغَفُورُ الرَّحِيمُ *", "tr": "Allahummahdina bihudak * wa ahsin i'tiqadana bibaqak * wa khudh binawasina ila ridak * wa nawwir qulubana binuril-yaqin * wa hab lana min basa'iril-mustabsirin * wahshurna ala ta'atika yawmad-din * wa ta'ati waliyyikal-imami Abil-Qasimi amiril-mu'minin * mustamsikina bil-hablil-matin * wa bil-urwatil-lati la infisama laha minal-mu'tasimin * Allahumma atina fid-dunya hasanatan wa fil-akhirati hasanatan wa jami'al-mu'minin * innaka antal-ghafurur-rahim *", "note": ""}], "notes": [], "finish": false, "round": 4, "total": 9, "roundLabel": "Station", "img": "data:image/webp;base64,UklGRnxjAABXRUJQVlA4IHBjAABQFAGdASooASwBPmEkj0WkIaEXO2aQQAYEo+1aRT0xmrUDuFeTE0W/wHEU/7C2BFgXrujLO+x/kb8z/Gekryj3d/RfxXnV7RO0/MS6o+bf5hf8z14f1bn3PYv5wP3L9Vv/ldC562Pref1j/r+0N+1/XYfu/6WODM8Z/z/gn5PfiX77/nP+56+OJv1n+w8xf5z+Q/6H+S+sD7sf0vfL8pv+H/L+wR7Y/4n5s/mr9e/4fZzb3/pf2h9gj2/+3/93/LfvL6Depl4T/8n5n/QF/S/7T/z/zQ+GP99/7/9j5dv2//c/uL8A/8//vn/b/0/5mfTX/j//j/kfmR7s/rT/6f7v4Fv6N/if+/+eH+o+ef/7e9X91faK/bBrMe+c4YNzSM16rUh6TDT1gakooMJ3RWYl2o06LA6q2QWd6Wwbi1BwfIXy8+LT6Y1F09G5jxzQFZ/0Ia3VW9daJmuiQF3I25bjjrtd30oGhTrTW1/BpAthQ9G5RGCCUIss4HVZKQTE/P6uWcj/zKeMWv5hyZlmn4e/l2veByU6ENPWw/cqR7obeGBvgIN8AAuE7UMKfu5yLj/6nmHWc/373UM8Hvk1psU3n1bRn91hCGtSq70vweXYHY8djM4Jd3DjZUNomrW/9dSerN+/P1eqxe32810ydfMKa04gIewaMEA6ycMpW0dgd4RmBid/r8yo+lxAkTF6xnvHzu0Gb7Y4FqNiYz+rrm6sqJzrJbU6Pt4F3HtS5VJun8YJrxiAialV2SgjOh40AigHDphgOXGzP7o+89vCDLSUK9I8RgLm3gUgj6/zJnzUVpoH6INSiZ9sYEUtW/XsiGalGaI0okjRUCMuHFTK/Z2uYZ5u15JKlTTgCKspgrcLFKWiml2pmuskK5ONnVM2U7I8Cmnr+mIdXe7txpG8cKtn5vNWVlNC1Nl7Oo4UCc5fOhZE82pZ75yxxRlEXFxDdMNieJNCs7AuFMdwFFTUTDaBNkiJDLJLIRgAQOvLFkAT6CgZPx/NqoAIVuDkC3pxxA75XxHE1WNi+/SANa9U2WevnVKGoc+Pi5Iipu9683ErJPfK0Ky+rQvo5sVq35IkA33/5qdegeh7C2SMmpdBAy/o1012O/JFUP5gWi5wGd6RvgKw1cJbXsgpitoicFAd4LFiXv6t/7XFoW8R6cK/voDtD9SM31cyuz24wv+acOfT1khh8e46fN5xtZkK9MFjLQ/e6iHNB1pLfLh5xAaHwWxQxDleXa4ZueYYkYadjKYnZwTzkTxjS/8xCn+T7931gCxWBOBA9mRcebHqJ4HT/SoACa6izJWYJkBuEb1u05N41EAb0Ht/t/zpqqE2GLtWUN8eHJ5vNp+45eUmP7TWsgH93TIJiO3EgBMh0zMEbv7R/cE97esvHWWDEUeusUNpFEipGSuwDuZR1n6bJINT1kqM5w6oxju5evRhNdj6U8/NXsJElURv1/sD596v/W0wcmcO1ql1EPdXSzAMxKGzgIVMA4YhpF8aL/kiHZQoYNWSdN+t9pDKxpYlx36XMOPfW0lpwnirA3JWu0REfPNfvB5ELbqysng0hELKuu+Nr9MqV2BoqnW/IUIB1LP7EUBj6cOxCujrN08o/u+A4q6fiiiCh3/LMIA1vUO5IYdHIwrlKbmetLUnSMD8bHfGVZUq1LbVOT0vUO/NlSRpyqWxzkTYJmq3TPQ2LS1Z3wVSpQ+aOIYUzF2PNkfoB2am69Oc6HCCSBs6lO7SL1oyAAimgstav6vDk0lBQPbj3WfMeq2W4H6LYZ9tEW4p+JyrbkjP9tfKMzdS9ndbuLS3mhCN5lCwupjtxLHFxAh1PVZ4mcdex7xvInqtnH720x 6 of 9: Ustuwana of Amir al-Mu'minin", "lead": "Also known as Ustuwana al-Haras.", "actions": ["Go to the pillar of Amir al-Mu'minin and pray two rak'at with this niyyah.", "After the salam, read the dua."], "duas": [{"title": "Niyyah for 2 rak'at", "ar": "أُصَلِّي صَلَاةَ التَّقَرُّبِ إِلَى اللَّهِ تَعَالَى رَكْعَتَيْنِ لِلَّهِ عَزَّ وَجَلَّ أَدَاءً مُسْتَقْبِلَ الْكَعْبَةِ الْحَرَامِ اللَّهُ أَكْبَرُ *", "tr": "Usalli salatat-taqarrubi ilallahi ta'ala rak'atayni lillahi azza wa jall ada'an mustaqbilal-ka'batil-haram Allahu akbar *", "note": "Go to the pillar of Amir al-Mu'minin (known as Ustuwana al-Haras) and pray two rak'at."}, {"title": "Dua after the salam", "ar": "اللَّهُمَّ اذْكُرْنِي وَوَالِدَيَّ وَجَمِيعَ مَا وَلَدَا وَكُلَّ وَلَدٍ وَوَالِدٍ * وَارْحَمِ الْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ مِنْكَ بِخَيْرٍ يُوجِبُ لِي رَحْمَتَكَ وَلَهُمْ وَيَسَعُنِي وَيَسَعُهُمْ * اللَّهُمَّ اجْعَلْنَا نَخَافُكَ وَلَا نَخَافُ سِوَاكَ * وَاجْعَلْ عَظِيمَ مَا نَأْمُلُ وَنَرْجُو رِضَاكَ * فَإِنَّا لَا نَعْبُدُ إِلَّا إِيَّاكَ * رَبِّ اغْفِرْ لِي وَلِوَالِدَيَّ كَمَا رَبَّيَانِي صَغِيرًا * إِلَهِي أَنَا الْوَضِيعُ الَّذِي رَفَعْتَهُ * وَالسَّائِلُ الَّذِي أَعْطَيْتَهُ * وَالْفَقِيرُ الَّذِي أَغْنَيْتَهُ * وَالطَّرِيدُ الَّذِي آوَيْتَهُ * لَا أُنْكِرُ فَضْلَكَ عَلَيَّ * وَلَا أَجْحَدُ إِحْسَانَكَ إِلَيَّ * يَا إِلَهِي وَمَوْلَايَ وَمُعْتَمَدِي وَرَجَائِي أَتْمِمْ عَلَيْنَا مَا سَلَفَ مِنْ نِعْمَتِكَ بِرَحْمَتِكَ * وَهَنِّئْنَا مَا سَبَغَ مِنْ إِحْسَانِكَ بِمَغْفِرَتِكَ * يَا مَنْ أَظْهَرَ الْجَمِيلَ * وَسَتَرَ الْقَبِيحَ * وَلَمْ يَهْتِكِ السِّتْرَ * يَا جَمِيلُ أَرْجُو فِعْلَكَ الْجَمِيلَ * فَاغْفِرْ لَنَا وَلِآبَائِنَا وَأُمَّهَاتِنَا وَأَوْلَادِنَا وَإِخْوَانِنَا مَغْفِرَةً لَا تَثْرِيبَ بَعْدَهَا * وَارْحَمْنَا رَحْمَةً لَا عِقَابَ مَعَهَا يَا أَرْحَمَ الرَّاحِمِينَ *", "tr": "Allahummadhkurni wa walidayya wa jami'a ma walada wa kulla waladin wa walid * warhamil-mu'minina wal-mu'minati minka bikhayrin yujibu li rahmataka wa lahum wa yasa'uni wa yasa'uhum * Allahummaj'alna nakhafu َهُ وَجُنُودَهُ * وَطَهِّرْ بِلَادَكَ مِنِ اخْتِرَاعَاتِهِ وَاخْتِلَاقَاتِهِ * وَأَرِحْ عِبَادَكَ مِنْ مَذَاهِبِهِ وَقِيَاسَاتِهِ * وَاجْعَلْ دَائِرَةَ السَّوْءِ عَلَيْهِمْ * وَابْسُطْ عَدْلَكَ وَأَظْهِرْ دِينَكَ وَقَوِّ أَوْلِيَاءَكَ * وَأَوْهِنْ أَعْدَاءَكَ * وَأَوْرِثْ دِيَارَ إِبْلِيسَ وَدِيَارَ أَوْلِيَائِهِ أَوْلِيَاءَكَ * وَخَلِّدْهُمْ فِي بَحْرِ جَحِيمِهِمْ * وَأَذِقْهُمْ مِنْ عَذَابٍ أَلِيمٍ * وَاجْعَلْ لِعَنَاتِكَ الْمُسْتَوْدَعَةَ فِي مَنَاخِسِ الْخِلْقَةِ وَمَيَاشِمِ الْفِطْرَةِ دَائِرَةً عَلَيْهِمْ * وَمُوَكَّلَةً بِهِمْ * وَجَارِيَةً فِيهِمْ * كُلَّ صَبَاحٍ وَمَسَاءٍ وَغُدُوٍّ وَرَوَاحٍ أَبَدًا * رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا بِرَحْمَتِكَ عَذَابَ النَّارِ * رَبَّنَا عَلَيْكَ تَوَكَّلْنَا وَإِلَيْكَ أَنَبْنَا وَإِلَيْكَ الْمَصِيرُ * حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ * وَنِعْمَ الْمَوْلَى وَنِعْمَ النَّصِيرُ * لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ الْعَلِيِّ الْعَظِيمِ *", "tr": "Allahumma inna Iblisal-mutamarridal-la'ina qadistanzaraka li-ighwa'i khalqika fa-anzartah * wastamhalaka li-idlali abidika famahhaltah * lisabiqi ilmika fih * wa qad ashshasha wa bada wa afrakh * wa kabarat wazdahamat juyushuh * wantasharat du'atuhu fi aqtaril-ard * fa-adallu ibadak * wa afsadu dinak * wa harrafu-l-kalima an mawadi'ih * wa ja'alu ibadaka shiya'an mutafarriqin * wa ahzaban mumazzaqin * wa qad wa'adta bitaqwidi bunyanih * wa tamziqi sha'nih * Allahumma fa-anjiz wa'daka * wa qawwid bunyanah * wa mazziq sha'nah * wa ahlik awladah * wa juyushahu wa du'atahu wa junudah * wa tahhir biladaka min ikhtira'atihi wa ikhtilaqatih * wa arih ibadaka min madhahibihi wa qiyasatih * waj'al da'irata-s-saw'i alayhim * wabsut adlaka wa azhir dinaka wa qawwi awliya'ak * wa awhin a'da'ak * wa awrith diyara Iblisa wa diyara awliya'ihi awliya'ak * wa khallidhum fi bahri jahimihim * wa adhiqhum min adhabin alim * waj'al la'anatikal-mustawda'ata fi manakhisil-khilqati wa mayashimil-fitrati da'iratan alayhim * wa muwakkalatan bihim * wa j ahrokh."}, {"phase": 5, "title": "Balagh 9 of 9: Dua al-Nur", "lead": "Read this after the dua at Fatima's room.", "actions": [], "duas": [{"title": "Dua al-Nur", "ar": "بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ\nبِسْمِ اللَّهِ النُّورِ * بِسْمِ اللَّهِ نُورٌ لِنُورٍ * بِسْمِ اللَّهِ نُورٌ عَلَى نُورٍ * بِسْمِ اللَّهِ هُوَ مُدَبِّرُ الْأُمُورِ * بِسْمِ اللَّهِ الَّذِي خَلَقَ النُّورَ * وَأَنْزَلَ النُّورَ عَلَى الطُّورِ فِي كِتَابٍ مَسْطُورٍ عَلَى النَّبِيِّ الْمَحْبُورِ * بِسْمِ اللَّهِ الَّذِي هُوَ بِالْعِزِّ مَذْكُورٌ وَبِالْفَخْرِ مَشْهُورٌ وَعَلَى السَّرَّاءِ وَالضَّرَّاءِ مَشْكُورٌ * وَصَلَّى اللَّهُ عَلَى مُحَمَّدٍ وَآلِهِ الطَّاهِرِينَ *", "tr": "Bismillahir-rahmanir-rahim\nBismillahin-nur * bismillahi nurun linur * bismillahi nurun ala nur * bismillahi huwa mudabbirul-umur * bismillahil-ladhi khalaqan-nur * wa anzalan-nura alat-tur fi kitabin mastur ala an-nabiyyil-mahbur * bismillahil-ladhi huwa bil-izzi madhkur wa bil-fakhri mashhur wa alas-sarra'i wad-darra'i mashkur * wa sallallahu ala Muhammadin wa alihit-tahirin *", "note": ""}], "notes": [], "finish": false, "round": 9, "total": 9, "roundLabel": "Station"}, {"phase": 6, "title": "Farewell from the mosque: dua", "lead": "When you leave Madina.", "actions": ["When you leave Madina, come to Masjid-un-Nabawi at a time when you can stay.", "Read the shahada and the salam, make dua, and pray.", "Then read this dua."], "duas": [{"title": "Farewell dua", "ar": "اللَّهُمَّ إِنَّا نَسْأَلُكَ أَنْ تَغْفِرَ لَنَا ذُنُوبَنَا * وَأَنْ تَجْعَلَ لَنَا مِنْ أَمْرِنَا يُسْرًا وَفَرَجًا وَمَخْرَجًا * يَا أَرْحَمَ الرَّاحِمِينَ * اللَّهُمَّ رَبَّنَا إِلَيْكَ مِنْ ذُنُوبِنَا فَرَرْنَا تَائِبِينَ فَتُبْ عَلَيْنَا * وَجِئْنَاكَ مِنْ سَيِّئَاتِنَا مُسْتَجِيرِينَ بِكَ فَأَجِرْنَا * وَرَاغِبِينَ وَسَائِلِينَ فَأَعْطِنَا * إِنَّا يَا رَبِّ عَبِيدُكَ * وَأَحَقُّ مَنْ سَأَلَ الْعَبْدُ رَبَّهُ * وَلَمْ يَسْأَلِ الْعِبَادُ أَكْرَمَ مِنْكَ وَلَا أَرْحَمَ * وَلَا أَوْسَعَ وَلَا أَعْلَمَ * يَا مَوْضِعَ كُلِّ شَكْوَى السَّائِلِينَ * يَا مُنْتَهَى رَغْبَةِ الرَّاغِبِينَ * يَا فَرَجَ الْمَكْرُوبِينَ * يَا مَأْوَى الْخَائِفِينَ * يَا عِصْمَةَ الْمُسْتَجِيرِينَ * يَا غِيَاثَ الْمُسْتَغِيثِينَ * اغْفِرْ لَنَا سَيِّئَاتِنَا * وَهَبْ لَنَا عَثَرَاتِنَا * وَارْزُقْنَا مِنْ فَضْلِكَ وَرَحْمَتِكَ * فَمَا يَمْلِكُهَا غَيْرُكَ * وَاعْفُ عَمَّا سَلَفَ * وَاعْصِمْنَا فِي الْمُؤْتَنَفِ * وَاسْتُرْ عَلَيْنَا وَعَلَى أَهْلِينَا وَأَوْلَادِنَا * وَلَا تُشْمِتْ بِنَا حَاسِدًا * وَلَا تُسَلِّطْ عَلَيْنَا عَدُوًّا لَا يَرْحَمُنَا * يَا أَرْحَمَ الرَّاحِمِينَ * اللَّهُمَّ ارْزُقْنَا الْجِدَّ وَالِاجْتِهَادَ فِي عِبَادَتِكَ * وَالْغَزْوَ وَالرِّبَاطَ فِي طَاعَتِكَ * وَصِدْقَ النِّيَّةِ وَالْخُضُوعَ * وَالتَّوْبَةَ وَالْوَجَلَ مِنْكَ * وَالرَّجَاءَ إِلَيْكَ وَالثِّقَةَ بِكَ * وَالتَّوَكُّلَ عَلَيْكَ وَالتَّوَرُّعَ عَنْ مَحَارِمِكَ * وَصَالِحَ الْقَوْلِ * وَمَقْبُولَ السَّعْيِ * وَمُسْتَجَابَ الدُّعَاءِ * وَلَا تَحُلْ بَيْنَنَا وَبَيْنَ ذَلِكَ بِعَرَضٍ وَلَا مَرَضٍ وَلَا حَزَنٍ * اللَّهُمَّ مَنْ كَانَ مِمَّنْ حَضَرَ هَذَا الْمَوْقِفَ تَائِبًا فَاقْبَلْ تَوْبَتَهُ * وَمَنْ كَانَ مُذْنِبًا فَاغْفِرْ ذَنْبَهُ * وَمَنْ كَانَ فَقِيرًا فَاجْبُرْ فَقْرَهُ * وَمَنْ كَانَ مَدْيُونًا فَاقْضِ دَيْنَهُ * وَمَغْمُومًا فَأَذْهِبْ غَمَّهُ * أَوْ مَكْرُوبًا فَفَرِّجْ كَرْبَهُ * وَمَنْ كَانَ خَائِفًا فَأَمِّنْ خَوْفَهُ * أَوْ مُحْتَاجًا فَاقْضِ حَاجَتَهُ * أَوْ طَالِبَ وَلَدٍ فَهَبْ لَهُ طَلِبَتَهُ * أَوْ زَوْجَةٍ فَزَوِّجْهُ * وَأَحْسِنْ مَعُونَتَهُ * اللَّهُمَّ اقْضِ لِكُلِّ ذِي حَاجَةٍ مِنَّا وَمِنْ جَمِيعِ الْمُسْلِمِينَ حَاجَتَهُ * وَأَنْجِزْ لَنَا آمَالَنَا وَآمَالَهُمْ * وَأَنْجِحْ سُؤْلَنَا وَسُؤْلَهُمْ * وَشَفِّعْ نَبِيَّكَ مُحَمَّدًا صَلَّى اللَّهُ عَلَيْهِ وَعَلَى آلِهِ فِينَا وَفِيهِمْ * وَلَا تَرُدَّنَا وَإِيَّاهُمْ خَائِبِينَ * وَلَا مَقْبُوحِينَ * بِرَحْمَتِكَ يَا أَرْحَمَ الرَّاحِمِينَ * اللَّهُمَّ وَمِنْ إِخْوَانِنَا الَّذِينَ خَلَّفْنَاهُمْ مَنْ يُحِبُّ مِثْلَ مَا أَحْبَبْنَا مِنَ الزِّيَارَةِ لِنَبِيِّنَا صَلَّى اللَّهُ عَلَيْهِ وَعَلَى آلِهِ وَالْحُضُورِ لِمَشَاهِدِهِ * مَعَ حَجِّ بَيْتِكَ الْحَرَامِ * وَالْقِيَامِ بِمَنَاسِكِكَ الْعِظَامِ * فَسَهِّلْ ذَلِكَ لَهُمْ * وَبَلِّغْهُمْ فِيهِ أَمَلَهُمْ * وَافْتَحْ لَنَا وَلَهُمْ مِنْ فَضْلِكَ مَا نَسْتَغْنِي بِهِ عَمَّنْ سِوَاكَ مِنْ خَلْقِكَ * اللَّهُمَّ لَا تَجْعَلْهُ آخِرَ الْعَهْدِ مِنْ هَذِهِ الْمَوَاقِفِ الشَّرِيفَةِ وَالْمَشَاهِدِ الزَّلِيفَةِ * وَارْزُقْنَا الْعَوْدَةَ إِلَيْهَا فِي كُلِّ عَامٍ أَبَدًا مَا أَحْيَيْتَنَا * إِنَّكَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ * وَذَلِكَ عَلَيْكَ يَسِيرٌ * اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ عَبْدِكَ وَرَسُولِكَ وَنَبِيِّكَ وَصَفِيِّكَ وَحَبِيبِكَ وَخَاصَّتِكَ وَخَالِصَتِكَ وَخِيرَتِكَ مِنْ خَلْقِكَ * وَصَفْوَتِكَ مِنْ جَمِيعِ بَرِيَّتِكَ * اللَّهُمَّ فَصَلِّ عَلَى نَبِيٍّ بِهِ مِنَ الضَّلَالَةِ هَدَيْتَنَا * وَرَسُولٍ بِهِ مِنَ الْجَهَالَةِ عَلَّمْتَنَا * وَرَؤُوفٍ بِهِ مِنَ الْعَمَايَةِ بَصَّرْتَنَا * وَرَحِيمٍ بِهِ مِنْ شَفَا جُرُفٍ أَنْقَذْتَنَا * وَخَاتِمٍ بِهِ مِنَ الزَّيْغِ أَخْرَجْتَنَا * وَجَعَلْتَنَا بِهِ خَيْرَ أُمَّةٍ أُخْرِجَتْ لِلنَّاسِ * وَشَرَّفْتَنَا بِهِ وَأَكْرَمْتَنَا * وَجَعَلْتَنَا بِهِ شُهَدَاءَ عَلَى النَّاسِ فَأَزْلَفْتَنَا * فَإِنَّكَ مَشْكُورٌ يَا مَوْلَانَا عَلَى مَا مَنَنْتَ بِهِ مِنْ ذَلِكَ وَأَوْلَيْتَنَا * فَصَلِّ اللَّهُمَّ يَا قَيُّومُ عَلَى نَبِيِّنَا وَإِمَامِنَا وَمُشَرِّفِنَا وَشَافِعِنَا وَوَلِيِّنَا وَوَسِيلَتِنَا مُحَمَّدٍ الْبَشِيرِ * وَخِيرَتِكَ النَّذِيرِ * وَصَفْوَتِكَ الْعَاقِبِ فِي أَرْضِكَ الْأَثِيرِ * أَسْنَى وَأَحْظَى وَأَكْثَرَ وَأَرْضَى وَأَنْضَرَ * وَأَزْكَى وَأَكْبَرَ * وَأَعْلَى وَأَفْخَرَ * وَأَنْمَى وَأَوْفَرَ * مَا صَلَّيْتَ عَلَى أَحَدٍ مِنْ خَلْقِكَ * الْحَافِّينَ بِعَرْشِكَ * وَالْمُسَبِّحِينَ بِقُدْسِكَ * الدَّائِبِينَ بِمَلَكُوتِكَ * لَدَى كُرْسِيِّكَ وَطَبَقَاتِ مَلَائِكَتِكَ مِنَ الْكَرُوبِيِّينَ وَالرُّوحَانِيِّينَ * وَمَنْ عَلِمْتَ وَجَهِلْنَا * وَأَحْصَيْتَ وَنَسِينَا * مِنَ الَّذِينَ أَكْرَمْتَهُمْ عِنْدَكَ بِالْقُرْبَةِ * وَفَضَّلْتَهُمْ بِالْعِصْمَةِ * وَأَزْلَفْتَهُمْ لَدَيْكَ بِالتَّقْدِمَةِ * وَصَلِّ يَا رَبِّ عَلَى أَنْبِيَائِكَ وَنُظَرَائِكَ * وَعَلَى مَنِ ارْتَضَيْتَ وَجَمَّلْتَ وَأَحْبَبْتَ وَأَرْشَدْتَ وَهَدَيْتَ وَاجْتَبَيْتَ مِنْ سُلَالَتِهِ الْمُطَهَّرِينَ * وَعِتْرَتِهِ الطَّيِّبِينَ * وَذُرِّيَّتِهِ الْمُصْطَفَيْنَ * وَصَلِّ يَا رَبِّ عَلَى مَلَائِكَتِكَ الْمُقَرَّبِينَ * وَأَنْبِيَائِكَ الْمُرْسَلِينَ * وَأَهْلِ طَاعَتِكَ أَجْمَعِينَ مِنْ سُكَّانِ السَّمَوَاتِ وَالْأَرَضِينَ * وَسَلِّمْ عَلَيْهِمْ تَسْلِيمًا كَثِيرًا * اللَّهُمَّ فَكَمَا صَلَّيْتَ عَلَيْهِمْ فَصَلِّ يَا رَبِّ عَلَى خَلِيفَتِهِمُ الْمُقْتَدِي بِشَرِيعَتِهِمْ * وَالْقَائِمِ بِمِلَّتِهِمْ * عَبْدِكَ وَخَلِيفَتِكَ * وَإِمَامِ أُمَّتِكَ الْإِمَامِ أَبِي الْقَاسِمِ أَمِيرِ الْمُؤْمِنِينَ * وَعَلَى آبَائِهِ الطَّاهِرِينَ * وَأَبْنَائِهِ الْمُكَرَّمِينَ * اللَّهُمَّ فَكَمَا وَفَّقْتَنَا لِحَجِّ بَيْتِكَ الْحَرَامِ * وَزِيَارَةِ قَبْرِ نَبِيِّكَ مُحَمَّدٍ عَلَيْهِ وَعَلَى آلِهِ السَّلَامُ * فَامْنُنْ عَلَيْنَا بِالنَّظَرِ إِلَى غُرَّتِهِ * وَاحْشُرْنَا فِي زُمْرَتِهِ * بِرَحْمَتِكَ يَا أَرْحَمَ الرَّاحِمِينَ * اللَّهُمَّ اغْفِرْ لَنَا وَلِآبَائِنَا وَأُمَّهَاتِنَا وَلِإِخْوَانِنَا وَأَهَالِينَا وَقَرَابَاتِنَا مَغْفِرَةَ الْأَبْرَارِ * وَأَعْتِقْنَا مِنْ عَذَابِ النَّارِ * يَا أَرْحَمَ الرَّاحِمِينَ * وَهَبْ لَنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَمَا بَيْنَهُمَا حَسَنَةً * وَقِنَا بِرَحْمَتِكَ عَذَابَ النَّارِ * يَا أَرْحَمَ الرَّاحِمِينَ * اللَّهُمَّ اغْفِرْ لِلْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ * الْأَحْيَاءِ مِنْهُمْ وَالْأَمْوَاتِ * إِنَّكَ رَفِيعُ الدَّرَجَاتِ * وَآخِرُ دَعْوَانَا وَمُنْتَهَى نَجْوَانَا أَنِ الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ * وَصَلَوَاتُهُ عَلَى رَسُولِهِ سَيِّدِنَا مُحَمَّدٍ خَاتَمِ النَّبِيِّينَ * وَعَلَى وَصِيِّهِ عَلِيِّ بْنِ أَبِي طَالِبٍ أَشْرَفِ الْوَصِيِّينَ * وَعَلَى الْأَئِمَّةِ مِنْ ذُرِّيَّتِهِمَا الطَّيِّبِينَ الطَّاهِرِينَ * وَعَلَى مَوْلَانَا وَسَيِّدِنَا الْإِمَامِ أَبِي الْقَاسِمِ أَمِيرِ الْمُؤْمِنِينَ * وَسَلَامُهُ عَلَيْهِمْ أَجْمَعِينَ * سَلَامًا دَائِمًا مُتَّصِلًا إِلَى يَوْمِ الدِّينِ * وَحَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ * وَنِعْمَ الْمَوْلَى وَنِعْمَ النَّصِيرُ *", "tr": "Allahumma inna nas'aluka an taghfira lana dhunubana * wa an taj'ala lana min amri ِ الْعَظِيمَةِ * وَمِنَّتِكَ هَذِهِ الْجَسِيمَةِ * أَنْ يَسَّرْتَ لِي زِيَارَةَ نَبِيِّكَ مُحَمَّدٍ خَاتَمِ النَّبِيِّينَ صَلَوَاتُكَ عَلَيْهِ وَآلِهِ أَجْمَعِينَ * وَدَامَتْ فُيُوضُ بَرَكَاتِكَ تَسْرِي إِلَيْهِ * وَقَدْ أَقَمْنَا فِي حَرَمِهِ الشَّرِيفِ مَا قَدَّرْتَهُ لَنَا * وَبَلَّغْتَنَا بِفَضْلِكَ أَمَلَنَا * وَقَدْ رَبِحْنَا بِزِيَارَتِهِ أَفْضَلَ أَرْبَاحِ الْعَالَمِينَ * وَلَقَدْ تَشَرَّفْنَا بِزِيَارَتِهِ عَارِفِينَ بِهِ وَبِالْأَئِمَّةِ مِنْ ذُرِّيَّتِهِ الْأَكْرَمِينَ * ثُمَّ إِنَّا نُفَارِقُ حَرَمَهُ الشَّرِيفَ الَّذِي هُوَ حَرَمُكَ * وَقَدْ شَمَلَنَا بِالْعُكُوفِ فِيهِ فَضْلُكَ وَكَرَمُكَ * فَنَحْنُ مُوَدِّعُوهُ وَدَاعَ مَنْ عَزَّ فِرَاقُهُ عَلَيْنَا وَغَمَّنَا وَأَوْحَشَنَا انْصِرَافُنَا عَنْ قُبَّتِهِ الْعَالِيَةِ * ذَاتِ الْأَنْوَارِ الْمُتَلَالِئَةِ * فَنَحْنُ قَائِلُونَ * اَلسَّلَامُ عَلَيْكَ يَا رَسُولَ رَبِّ الْعَالَمِينَ * وَيَا سَيِّدَ الْمُرْسَلِينَ * وَيَا خَاتَمَ النَّبِيِّينَ * وَيَا نُورَ الْمُهْتَدِينَ * اَلسَّلَامُ عَلَيْكَ غَيْرَ مُوَدِّعٍ بَرَمًا وَلَا مَتْرُوكٍ زِيَارَتُهُ سَأَمًا * اَلسَّلَامُ عَلَيْكَ مِنْ مَقَامٍ رَقَّتْ فِيهِ الْقُلُوبُ * وَقَلَّتْ فِيهِ الذُّنُوبُ * اَلسَّلَامُ عَلَيْكَ مِنْ مَقَامٍ قَرُبَتْ فِيهِ الْآمَالُ وَنُشِرَتْ فِيهِ الْأَعْمَالُ * اَلسَّلَامُ عَلَيْكَ مِنْ مَطْلُوبٍ قَبْلَ الْوُصُولِ إِلَيْهِ وَمَحْزُونٍ عَلَيْهِ قَبْلَ الْفِرَاقِ مِنْهُ * اَلسَّلَامُ عَلَيْكَ كَمْ مِنْ سُوءٍ صُرِفَ بِكَ عَنَّا * وَكَمْ مِنْ خَيْرٍ أُفِيضَ بِكَ عَلَيْنَا * اَلسَّلَامُ عَلَيْكَ مَا كَانَ أَحْرَصَنَا بِالْأَمْسِ عَلَيْكَ * وَأَشَدَّ شَوْقَنَا غَدًا إِلَيْكَ * اَلسَّلَامُ عَلَيْكَ وَعَلَى فَضْلِكَ الَّذِي حُرِمْنَاهُ * وَعَلَى مَاضٍ مِنْ بَرَكَاتِكَ سُلِبْنَاهُ * اَلسَّلَامُ عَلَيْكَ يَا خَيْرَ مَنْ أَعَانَ عَلَى الشَّيْطَانِ * وَصَاحِبَ فَضْلٍ سَهَّلَ سُبُلَ الْإِحْسَانِ * اَلسَّلَامُ عَلَيْكَ مَا أَكْثَرَ عُتَقَاءَ اللَّهِ فِيكَ * وَمَا أَسْعَدَ مَنْ رَعَى حُرْمَتَكَ بِكَ * اَلسَّلَامُ عَلَيْكَ مَا كَانَ أَمْحَى زِيَارَتَكَ لِلذُّنُوبِ * وَمَا أَسْتَرَهَا لِأَنْوَاعِ الْعُيُوبِ * اَلسَّلَامُ عَلَيْكَ كَمَا أَدَرَّتْ زِيَارَتُكَ عَلَيْنَا الْبَرَكَاتِ * وَكَشَفَتْ عَنَّا الْكُرُبَاتِ * وَغَسَلَتْ عَنَّا دَنَسَ الْخَطِيئَاتِ * وَمَحَتْ عَنَّا السَّيِّئَاتِ * وَضَاعَفَتْ لَنَا الْحَسَنَاتِ * فَنَسْأَلُكَ اللَّهُمَّ بِحُرْمَةِ نَبِيِّكَ هَذَا أَنْ لَا تَجْعَلَهُ آخِرَ الْعَهْدِ مِنْ زِيَارَتِهِ * وَاسْتَجِبِ اللَّهُمَّ دُعَاءَنَا بِشَفَاعَتِهِ * وَأَكْرِمْنَا بِكَرَامَتِهِ * وَتَوَفَّنَا مَعَ الْأَبْرَارِ مُعْتَصِمِينَ بِعُرْوَتِهِ * وَأَدْخِلْنَا الْجَنَّةَ بِحُرْمَتِهِ * وَاحْشُرْنَا فِي زُمْرَتِهِ * وَارْزُقْنَا زِيَارَتَهُ فِي كُلِّ عَامٍ * وَاخْصُصْهُ بِأَفْضَلِ الصَّلَاةِ وَالسَّلَامِ * وَاجْعَلْ ذَلِكَ مَقْبُولًا مَشْكُورًا لَدَيْكَ مَذْخُورًا عِنْدَكَ * وَأَلْهِمْنَا يَا رَبِّ شُكْرَكَ وَحَمْدَكَ * اللَّهُمَّ تَجَاوَزْ عَنْ آبَائِنَا وَأُمَّهَاتِنَا وَأَهْلِ دِينِنَا جَمِيعًا مَنْ سَلَفَ مِنْهُمْ وَمَنْ غَبَرَ إِلَى يَوْمِ الْقِيَامَةِ * اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ نَبِيِّنَا وَآلِهِ كَمَا صَلَّيْتَ عَلَى مَلَائِكَتِكَ الْمُقَرَّبِينَ * وَصَلِّ عَلَيْهِ وَآلِهِ كَمَا صَلَّيْتَ عَلَى أَنْبِيَائِكَ الْمُرْسَلِينَ * وَصَلِّ عَلَيْهِ وَآلِهِ كَمَا صَلَّيْتَ عَلَى عِبَادِكَ الصَّالِحِينَ * وَأَفْضَلَ مِنْ ذَلِكَ يَا رَبَّ الْعَالَمِينَ * صَلَاةً تُبَلِّغُنَا بَرَكَتَهَا * وَيَنَالُنَا نَفْعُهَا * وَيُسْتَجَابُ لَهَا دُعَاؤُنَا * إِنَّكَ أَكْرَمُ مَنْ رُغِبَ إِلَيْهِ * وَأَكْفَى مَنْ تُوُكِّلَ عَلَيْهِ * وَأَعْطَى مَنْ سُئِلَ مِنْ فَضْلِهِ * وَأَنْتَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ *", "tr": "Allahumma lakal-hamdu ala ni'matika hadhihil-azimah * wa minnatika hadhihil-jasimah * an yassarta li ziyarata nabiyyika Muhammadin khatamin-nabiyyina salawatuka alayhi wa alihi ajma'in * wa damat fuyudu barakatika tasri ilayh * wa qad aqamna fi haramihish-sharifi ma qaddartahu lana * wa ballaghtana bifadlika amalana * wa qad rabihna biziyaratihi afdala arbahil-alamin * wa laqad tasharrafna biziyaratihi arifina bihi wa bil-a'immati min dhurriyyatihil-akramin * thumma inna nufariqu haramahush-sharifal-ladhi huwa haramuk * wa qad shamalana bil-ukufi fihi fadluka wa karamuk * fanahnu muwadda'uhu wada  الْمَاءِ الصَّافِي * وَكَسَاهُ اللَّهُ مِنَ الْعِصْمَةِ الْكِسَاءَ الضَّافِي * وَكَانَ فَضْلُهُ الظَّاهِرُ كَالصَّبَاحِ غَيْرَ الْخَافِي * اَلسَّلَامُ عَلَيْكَ مِنْ إِمَامٍ كَرِيمٍ تَلَالَأَتْ سُبُحَاتُ نُورِ اللَّهِ فِي جَبْهَتِهِ الشَّفَّافَةِ * وَكَفَتْ شَآبِيبُ الْجُودِ مِنْ سُحُبِهِ الْوَكَّافَةِ * اَلسَّلَامُ عَلَيْكَ مِنْ إِمَامٍ كَرِيمٍ مَلَائِكَةُ اللَّهِ مُصَلِّيَةٌ عَلَى مَقَامِهِ الْعَظِيمِ وَمُبَارَكَةٌ * وَنُوقُ آمَالِ الْمُؤْمِنِينَ بِسُوحِهِ الْكَرِيمِ بَارِكَةٌ * اَلسَّلَامُ عَلَيْكَ مِنْ إِمَامٍ هُوَ صَفْوَةُ الْخَلْقِ * وَلَهُ دَعْوَةُ الْحَقِّ * جَعَلَهُ اللَّهُ خَلِيفَتَهُ فِي خَلِيقَتِهِ * وَجَعَلَ سَمَاءَ صَدْرِهِ الصَّافِي مَطْلَعَ أَنْوَارِ عِلْمِهِ وَحَقِيقَتِهِ * وَطَلَعَ أَزْهَارُ حَدَائِقِ جَبَرُوتِهِ فِي مُخْضَرِّ حَدِيقَتِهِ * اَلسَّلَامُ عَلَيْكَ مِنْ إِمَامٍ لَهُ الْقُدْرَةُ الْقَاهِرَةُ * وَالْمُكَرَّمَاتُ الزَّاهِرَةُ * وَالْأَخْلَاقُ الْقُدْسِيَّةُ الطَّاهِرَةُ * وَنِعْمَةٌ عَلَى عَبِيدِ دَعْوَةِ وَلَدِهِ مُحَمَّدٍ رَسُولِ اللَّهِ سَوَابِغُ مَا بَيْنَ بَاطِنَةٍ وَظَاهِرَةٍ * اَلسَّلَامُ عَلَيْكَ مِنْ إِمَامٍ كَانَ فِي حُلْبَةِ الْعِلْمِ الْمَلَكُوتِيِّ مُجَلِّيًا * وَلِنَجْلِهِ مُحَمَّدٍ الْمُصْطَفَى خَاتَمِ النَّبِيِّينَ لِغَوَاشِي الْمُعْضِلَاتِ مُجَلِّيًا * وَلِبِنَاءِ مَجْدِهِ الْعُدْمُلِيِّ مُعَلِّيًا * اَلسَّلَامُ عَلَيْكَ يَا مَوْلَايَ عَبْدَ اللَّهِ بْنَ عَبْدِ الْمُطَّلِبِ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ *", "tr": "as-salamu alayka ya mawlaya Abdallahi bna Abdil-Muttalib * wa ya mus'ifal-muna wal-arab * wa ya man khassahullahu ta'ala bil-fadlil-asna wal-maqamil-ajall * wa ya man fada anhu walidihul-imamul-awhadul-anbal * ba'da an uqtu'ira alayhi bimi'atin minal-ibil * as-salamu alayka min imamin atahullahu sharafan azimanw wa mafkhara * bi-an a'tahu waladan tahiran mutahhara * abda'ahu min nuril-lahuti jawhara * alladhi athara lahu ta'ala muzhira * wa bihi dinahu alad-dini kullihi azhara * wa arsalahu ba'dal-masihi tabiban qudsiyyan yubri'ul-akmaha wal-abrasa wa yuhyil-mawta bi-idhnillahi aliman natasa * nabiyyan assasa qawa'idal-islami alat-taqwa wa arsa * as-salamu alayka min imamin kathiril-hasanat * amimil-barakat * as-salamu alayka min imamin kana shabahuhun-nuraniyyu yata-la'la'u kash-shabahi fil-ma'is-safi * wa kasahullahu minal-ismatil-kisa'ad-dafi * wa kana fadluhuz-zahiru kas-sabahi ghayril-khafi * as-salamu alayka min imamin karimin tala'lat subuhatu nurillahi fi jabhatihish-shaffafah * wa kafat sha'abibul-judi min suhubihil-wakkafah * as-salamu alayka min imamin karimin mala'ikatullahi musalliyatun ala maqamihil-azimi wa mubarakah * wa nuqu amalil-mu'minina bisuhihil-karimi barikah * as-salamu alayka min imamin huwa safwatul-khalq * wa lahu da'watul-haqq * ja'alahullahu khalifatahu fi khaliqatih * wa ja'ala sama'a sadrihis-safi matla'a anwari ilmihi wa haqiqatih * wa tala'a azharu hada'iqi jabarutih fi mukhdarri hadiqatih * as-salamu alayka min imamin lahul-qudratul-qahirah * wal-mukarramatuz-zahirah * wal-akhlaqul-qudsiyyatut-tahirah * wa ni'matun ala abidi da'wati waladihi Muhammadin rasulillahi sawabighu ma bayna batinatin wa zahirah * as-salamu alayka min imamin kana fi hulbatil-ilmil-malakutiyyi mujalliyan * wa linajlihi Muhammadinil-mustafa khatamin-nabiyyina lighawashil-mu'dilati mujalliyan * wa libina'i majdihil-udmuliyyi mu'alliyan * as-salamu alayka ya mawlaya Abdallahi bna Abdil-Muttalib wa rahmatullahi wa barakatuh *", "note": "Some words were hard to read in the original scan. Check this against your booklet."}], "notes": [], "finish": false}, {"phase": 2, "title": "Your visit is complete", "lead": "May Allah accept it from you.", "actions": ["Make dua for yourself, your family and all believers."], "duas": [], "notes": [], "finish": true}]}, "mosques": {"brand": "Mosques of Madinah", "title": "Mosques of Madinah and Uhud", "ar": "مساجد المدينة", "sub": "Quba, Suqya, Zaynab bint Jahsh, Fadikh, Umm Ibrahim, Sabq, Fath, Raya, Hamza and the martyrs of Uhud.", "phases": ["Quba", "Suqya and Zaynab", "Fadikh, Umm Ibrahim, Sabq", "Fath and Raya", "Hamza and Uhud"], "steps": [{"phase": 0, "title": "Before you visit the mosques", "lead": "How to read this section.", "actions": ["There is no fixed order for visiting the mosques. Start with any mosque and end where you like.", "In each mosque, pray two rak'at of Tahiyyat al-Masjid first, then the two rak'at with the niyyah given, and read the dua after the salam.", "Some of these mosques are currently demolished. The booklet marks them, and you can read the dua without going inside."], "duas": [], "notes": [], "finish": false}, {"phase": 0, "title": "Masjid Quba: prayer and dua", "lead": "The first mosque of Islam.", "actions": ["Pray two rak'at of Tahiyyat al-Masjid, then pray two rak'at with this niyyah.", "After the salam, read the dua."], "duas": [{"title": "Niyyah for 2 rak'at", "ar": "أُصَلِّي صَلَاةً لِطَلَبِ التَّقْوَى مِنَ اللَّهِ تَعَالَى رَكْعَتَيْنِ لِلَّهِ عَزَّ وَجَلَّ أَدَاءً مُسْتَقْبِلَ الْكَعْبَةِ الْحَرَامِ اللَّهُ أَكْبَرُ *", "tr": "Usalli salatan litalabit-taqwa minallahi ta'ala rak'atayni lillahi azza wa jall ada'an mustaqbilal-ka'batil-haram Allahu akbar *", "note": "Pray two rak'at of Tahiyyat al-Masjid first, then these two rak'at with this niyyah."}, {"title": "Dua after the prayer", "ar": "اللَّهُمَّ هَذَا الْمَسْجِدُ الَّذِي قُلْتَ فِيهِ لَمَسْجِدٌ أُسِّسَ عَلَى التَّقْوَى مِنْ أَوَّلِ يَوْمٍ أَحَقُّ أَنْ تَقُومَ فِيهِ * اللَّهُمَّ فَكَمَا رَزَقْتَنَا الْوُصُولَ إِلَيْهِ وَالصَّلَاةَ فِيهِ فَاقْبَلْ مِنَّا وَلَا تُخَيِّبْنَا * وَارْحَمْ ضُعْفَنَا وَضُرَّنَا وَمَسْكَنَتَنَا * وَسُدَّ فَاقَتَنَا * اللَّهُمَّ إِنَّا نَسْأَلُكَ نَعِيمًا لَا يَنْفَدُ * وَفَرَحًا لَا يَنْكَدُ * وَمُرَافَقَةَ مُحَمَّدٍ وَآلِ مُحَمَّدٍ عَلَيْهِمُ السَّلَامُ * اللَّهُمَّ طَهِّرْ قُلُوبَنَا مِنَ النِّفَاقِ * وَأَعْمَالَنَا مِنَ الرِّيَاءِ * وَأَبْدَانَنَا مِنَ الرِّبَا * وَهَبْ لَنَا مِنْ لَدُنْكَ رَحْمَةً إِنَّكَ أَنْتَ الْوَهَّابُ * اللَّهُمَّ لَا تَدَعْ لَنَا حَاسِدًا إِلَّا أَرْغَمْتَهُ * وَلَا عَدُوًّا إِلَّا أَخْذَلْتَهُ * وَلَا رَجَاءً إِلَّا سَهَّلْتَهُ * وَلَا ضَعِيفًا إِلَّا قَوَّيْتَهُ * وَلَا صَغِيرًا إِلَّا رَبَّيْتَهُ * وَلَا حَاجَةً مِنْ حَوَائِجِ الدُّنْيَا وَالْآخِرَةِ لَكَ فِيهَا رِضًى وَلَنَا فِيهَا صَلَاحٌ إِلَّا قَضَيْتَهَا يَا أَرْحَمَ الرَّاحِمِينَ *", "tr": "Allahumma hadhal-masjidul-ladhi qulta fihi lamasjidun ussisa alat-taqwa min awwali yawmin ahaqqu an taquma fih * Allahumma fakama razaqtanal-wusula ilayhi was-salata fihi faqbal minna wa la tukhayyibna * warham du'fana wa durrana wa maskanatana * wa sudda faqatana * Allahumma inna nas'aluka na'iman la yanfad * wa farahan la yankad * wa murafaqata Muhammadin wa ali Muhammadin alayhimus-salam * Allahumma tahhir qulubana minan-nifaq * wa a'malana minar-riya' * wa abdanana minar-riba * wa hab lana min ladunka rahmatan innaka antal-wahhab * Allahumma la tada' lana hasidan illa arghamtah * wa la aduwwan illa akhdhaltah * wa la raja'an illa sahhaltah * wa la da'ifan illa qawwaytah * wa la saghiran illa rabbaytah * wa la hajatan min hawa'ijid-dunya wal-akhirati laka fiha ridan wa lana fiha salahun illa qadaytaha ya arhamar-rahimin *", "note": ""}], "notes": [], "finish": false}, {"phase": 0, "title": "Masjid Quba: prayer gifted to Maulana Salman al-Farisi", "lead": "A second prayer, and his salam.", "actions": ["Pray two more rak'at with this niyyah, as a gift to Maulana Salman al-Farisi.", "After the salam, read the salam written by Syedna Taher Saifuddin."], "duas": [{"title": "Niyyah for 2 rak'at", "ar": "أُصَلِّي الصَّلَاةَ هَدِيَّةً إِلَى مَوْلَانَا سَلْمَانَ الْفَارِسِيِّ رَكْعَتَيْنِ لِلَّهِ عَزَّ وَجَلَّ أَدَاءً مُسْتَقْبِلَ الْكَعْبَةِ الْحَرَامِ اللَّهُ أَكْبَرُ *", "tr": "Usalli-s-salata hadiyyatan ila mawlana Salmanal-Farisiyyi rak'atayni lillahi azza wa jall ada'an mustaqbilal-ka'batil-haram Allahu akbar *", "note": ""}, {"title": "Salam to Maulana Salman al-Farisi", "ar": "اَلسَّلَامُ عَلَيْكَ أَيُّهَا الْعَبْدُ الصَّالِحُ الْمُطِيعُ لِلَّهِ وَلِرَسُولِهِ وَلِأُولِي الْأَمْرِ * اَلسَّلَامُ عَلَيْكَ أَيُّهَا الْعَابِدُ الزَّاهِدُ الْمَحْبُوُّ فِي رِضَاءِ اللَّهِ وَرِضَاءِ أَوْلِيَائِهِ طُولَ الْعُمُرِ * اَلسَّلَامُ عَلَيْكَ يَا سَلْمَانُ فَارِسٌ * اَلسَّلَامُ عَلَيْكَ يَا مَنْ هُوَ فِي حَلْبَةِ الزُّهْدِ وَالتَّقْوَى خَيْرُ فَارِسٍ * وَلِكُتُبِ الْأَسْرَارِ الْمَلَكُوتِيَّةِ خَيْرُ دَارِسٍ * وَلِرُسُومِ الْأَسْحَارِ الْبَابِلِيَّةِ خَيْرُ دَارِسٍ * وَلِنَخِيلِ الْإِيمَانِ فِي أَرْضِ الْإِسْلَامِ خَيْرُ غَارِسٍ * وَلِلِبَاسِ التَّقْوَى خَيْرُ لَابِسٍ * وَلِنُورِ الْهُدَى مِنْ طُورِ التُّقَى خَيْرُ قَابِسٍ * وَفِي مَجَالِسِ الصَّالِحِينَ خَيْرُ جَالِسٍ * اَلسَّلَامُ عَلَيْكَ يَا سَلْمَانُ * يَا مَنْ سَجَدَ لِلرَّحْمَنِ * وَأَخْلَصَ بِاللَّهِ وَبِرَسُولِهِ الْإِيمَانَ * وَأَوْفَى بِمَا عَاهَدَ عَلَيْهِ اللَّهَ وَلَمْ يَنْكُثِ الْعُهُودَ وَلَمْ يَنْقُضِ الْأَيْمَانَ * اَلسَّلَامُ عَلَيْكَ يَا مَنْ هُوَ مِنَ الْخِلْقَةِ مُصَاصٌ وَلُبَابٌ * وَيَا مَنْ هُوَ لِبَيْتِ النُّورِ اللَّاهُوتِيِّ بَابٌ * وَيَا مَنْ كَانَ رَبُّ مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَعَلَى آلِهِ رَبَّهُ وَلَمْ يَكُنْ لَهُ مِنْ دُونِ اللَّهِ الْأَرْبَابُ * يَا مَنِ انْتَهَى إِلَى نَبِيٍّ انْتَهَتْ إِلَيْهِ الْأَسْبَابُ * وَبِهِ خُتِمَ الْكِتَابُ * اَلسَّلَامُ عَلَيْكَ يَا مَنْ هُوَ لِخَيْرِ خَلْقِ اللَّهِ سُبْحَانَهُ خَيْرُ الْأَصْحَابِ * اَلسَّلَامُ عَلَيْكَ يَا مَنْ شَرَّفَهُ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَعَلَى آلِهِ بِقَوْلِهِ سَلْمَانُ مِنَّا أَهْلَ الْبَيْتِ * وَيَا مَنْ عَبَدَ الْحَيَّ الْقَيُّومَ دُونَ الْمَيِّتِ * وَيَا مَنِ اسْتُخْرِجَ مِنْ شَجَرَةٍ تَخْرُجُ مِنْ طُورِ سَيْنَاءَ تَنْبُتُ بِالدُّهْنِ وَصِبْغٍ لِلْآكِلِينَ بِخَيْرِ زَيْتٍ * أَشْهَدُ أَنَّكَ قَدْ أَقَمْتَ الصَّلَاةَ وَآتَيْتَ الزَّكَاةَ * وَأَطَعْتَ اللَّهَ وَرَسُولَهُ وَمَنْ فَرَضَ اللَّهُ عَلَيْكَ طَاعَتَهُ * وَاعْتَصَمْتَ بِمَنْ رَجَوْتَ شَفَاعَتَهُ * وَأَنَّكَ كُنْتَ لِلْقُدْسِ حَظِيرَةً * وَأَنَّكَ عِشْتَ حَمِيدَ الْوَتِيرَةِ * وَمَضَيْتَ عَلَى بَصِيرَةٍ * فَرَضِيَ اللَّهُ عَنْكَ وَأَرْضَاكَ وَنَضَّرَ وَجْهَكَ بِنَضْرَةِ النَّعِيمِ * وَخَصَّكَ بِرِضْوَانٍ مِنْهُ وَسَلَامٍ * فَإِنَّكَ وَفَدْتَ عَلَيْهِ بِالْقَلْبِ السَّلِيمِ جَمَعَ اللَّهُ بَيْنَنَا وَبَيْنَكَ فِي رَوْضَاتِ الْجَنَّاتِ مَعَ النَّبِيِّينَ وَالصِّدِّيقِينَ وَالشُّهَدَاءِ وَالصَّالِحِينَ وَحَسُنَ أُولَئِكَ رَفِيقًا ذَلِكَ الْفَضْلُ مِنَ اللَّهِ وَكَفَى بِاللَّهِ عَلِيمًا * وَصَلَّى اللَّهُ عَلَى خَيْرِ خَلْقِهِ مُحَمَّدٍ الْمُصْطَفَى وَآلِهِ الطَّاهِرِينَ وَأَصْحَابِهِ وَسَلَّمَ تَسْلِيمًا *", "tr": "as-salamu alayka ayyuhal-abdus-salihul-muti'u lillahi wa lirasulihi wa li-ulil-amr * as-salamu alayka ayyuhal-abidiz-zahidul-mahbuwwu fi rida'illahi wa rida'i awliya'ihi tulal-umur * as-salamu alayka ya Salmanu Faris * as-salamu alayka ya man huwa fi hulbatiz-zuhdi wat-taqwa khayru faris * wa likutubil-asraril-malakutiyyati khayru daris * wa li-rusumil-ashar al-babiliyyati khayru daris * wa linakhilil-imani fi ardil-islami khayru gharis * wa lil-libasit-taqwa khayru labis * wa linuril-huda min turit-tuqa khayru qabis * wa fi majalisis-salihina khayru jalis * as-salamu alayka ya Salman * ya man sajada lir-rahman * wa akhlasa billahi wa birasulihil-iman * wa awfa bima ahada alayhillaha wa lam yankuthil-uhuda wa lam yanqudil-aymana * as-salamu alayka ya man huwa minal-khilqati musasun wa lubab * wa ya man huwa libaytin-nuril-lahutiyyi bab * wa ya man kana rabbu Muhammadin sallallahu alayhi wa ala alihi rabbahu wa lam yakun lahu min dunillahil-arbab * ya man intaha ila nabiyyin intahat ilayhil-asbab * wa bihi khutimal-kitab * as-salamu alayka ya man huwa likhayri khalqillahi subhanahu khayrul-ashab * as-salamu alayka ya man sharrafahu rasulullahi sallallahu alayhi wa ala alihi biqawlihi Salmanu minna ahlal-bayt * wa ya man abadal-hayyal-qayyuma dunal-mayyit * wa ya manistukhrija min shajaratin takhruju min turi sayna'a tanbutu bid-duhni wa sibghin lil-akilina bikhayri zayt * ashhadu annaka qad aqamtas-salata wa ataytaz-zakah * wa ata'tallaha wa rasulahu wa man faradallahu alayka ta'atah * wa'tasamta biman rajawta shafa'atah * wa annaka kunta lil-qudsi hazirah * wa annaka ishta hamidal-watirah * wa madayta ala basirah * fa-radiyallahu anka wa ardak wa nadhdhara wajhaka binadratin-na'im * wa khassaka biridwanin minhu wa salam * fa-innaka wafadta alayhi bil-qalbis-salim jama'allahu baynana wa baynaka fi rawdatil-jannati ma'an-nabiyyina was-siddiqina wash-shuhada'i was-salihin wa hasuna ula'ika rafiqa dhalikal-fadlu minallahi wa kafa billahi alima * wa sallallahu ala khayri khalqihi Muhammadinil-Mustafa wa alihit-tahirina wa ashabihi wa sallama taslima *", "note": ""}], "notes": [], "finish": false}, {"phase": 0, "title": "Masjid Quba: dua at the place of dua", "lead": "Facing the qibla.", "actions": ["Go to the place of dua in the mosque, stand facing the qibla and read this dua."], "duas": [{"title": "Dua at the place of dua", "ar": "اللَّهُمَّ أَنْتَ الْأَوَّلُ وَالْآخِرُ * وَالظَّاهِرُ وَالْبَاطِنُ * الْبَدِيءُ الْبَدِيعُ * الْعَلِيُّ الرَّفِيعُ * الَّذِي يُمْسِكُ السَّمَاءَ أَنْ تَقَعَ عَلَى الْأَرْضِ إِلَّا بِإِذْنِهِ * لَكَ الْحَمْدُ يَا مَلِكَ الْمُلُوكِ * لَكَ الْحَمْدُ يَا جَبَّارَ الْجَبَابِرَةِ * لَكَ الْحَمْدُ يَا مَعْدِنَ الْحَمْدِ * لَكَ الْحَمْدُ الَّذِي لَا يَنْفَدُ * سَبَقَتْ رَحْمَتُكَ غَضَبَكَ * وَعَلَا عَلَى كُلِّ شَيْءٍ أَمْرُكَ * لَا إِلَهَ إِلَّا أَنْتَ * اللَّهُمَّ هَذَا مَقَامُ الْعَائِذِ بِكَ مِنَ النَّارِ * اللَّهُمَّ فَزَحْزِحْنَا عَنِ النَّارِ * وَتُبْ عَلَيْنَا تَوْبَتَكَ عَلَى الْأَبْرَارِ * إِنَّكَ تَمْحُو مَا تَشَاءُ وَتُثْبِتُ وَعِنْدَكَ أُمُّ الْكِتَابِ * اللَّهُمَّ صَلِّ عَلَى حُدُودِكَ النُّورَانِيِّينَ * وَمَلَائِكَتِكَ الْكَرُوبِيِّينَ وَالرُّوحَانِيِّينَ * وَأَنْبِيَائِكَ الْمُرْسَلِينَ * وَأَئِمَّتِكَ الطَّاهِرِينَ * وَخُصَّ يَا رَبِّ بِأَفْضَلِ صَلَوَاتِكَ * وَأَزْكَى تَحِيَّاتِكَ * وَأَكْمَلِ بَرَكَاتِكَ * مُحَمَّدًا عَبْدَكَ وَرَسُولَكَ وَنَبِيَّكَ وَصَفِيَّكَ وَخِيرَتَكَ مِنْ خَلْقِكَ * الَّذِي قُلْتَ فِيهِ إِنَّ اللَّهَ وَمَلَائِكَتَهُ يُصَلُّونَ عَلَى النَّبِيِّ يَا أَيُّهَا الَّذِينَ آمَنُوا صَلُّوا عَلَيْهِ وَسَلِّمُوا تَسْلِيمًا * اللَّهُمَّ فَصَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ حَتَّى تَرْضَى * وَصَلِّ عَلَيْهِ وَعَلَى آلِهِ بَعْدَ الرِّضَى صَلَاةً لَا حَدَّ لَهَا وَلَا مُنْتَهَى * اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ النَّبِيِّ * وَعَلَى أَسَاسِهِ عَلِيٍّ الْوَصِيِّ * وَعَلَى فَاطِمَةَ الزَّهْرَاءِ * وَعَلَى خَدِيجَةَ الْكُبْرَى * وَعَلَى الْحَسَنِ وَالْحُسَيْنِ سِبْطَيْ نَبِيِّ الْهُدَى * وَعَلَى عَلِيِّ بْنِ الْحُسَيْنِ زَيْنِ الْعَابِدِينَ * وَعَلَى مُحَمَّدِ بْنِ عَلِيٍّ عَلَمِ الشَّاكِرِينَ * وَعَلَى جَعْفَرِ بْنِ مُحَمَّدٍ صِدِّيقِ الصَّادِقِينَ الْأَمِينِ * وَعَلَى إِسْمَاعِيلَ بْنِ جَعْفَرٍ نُورِ الْمُهْتَدِينَ * وَعَلَى مُحَمَّدِ بْنِ إِسْمَاعِيلَ سِرَاجِ الْمُقْتَدِينَ * وَعَلَى أَوْلَادِهِ الْمَسْتُورِينَ عَبْدِ اللَّهِ بْنِ مُحَمَّدٍ * وَأَحْمَدَ بْنِ عَبْدِ اللَّهِ * وَالْحُسَيْنِ بْنِ أَحْمَدَ * وَعَلَى الْقَائِمِينَ مِنْ نَسْلِهِمْ وَأَعْقَابِهِمْ * مَوْلَانَا الْمَهْدِيِّ بِكَ * وَالْقَائِمِ بِأَمْرِكَ * وَالْمَنْصُورِ بِنَصْرِكَ * وَالْمُعِزِّ لِدِينِكَ * وَالْعَزِيزِ بِكَ * وَالْحَاكِمِ بِأَمْرِكَ * وَالظَّاهِرِ لِإِعْزَازِ دِينِكَ * وَالْمُسْتَنْصِرِ بِكَ * وَالْمُسْتَعْلِي بِسُلْطَانِ كَلِمَاتِكَ * وَالْمَنْصُورِ أَبِي عَلِيٍّ الْآمِرِ بِأَحْكَامِكَ * الْمَنْقُولِينَ إِلَى دَارِ كَرَامَتِكَ * وَمَحَلِّ جَنَّتِكَ * الْقَائِمِينَ بِشَرِيعَتِكَ * وَاخْتَصَّ يَا رَبِّ أَبَا الْقَاسِمِ الْخَلِيفَةَ مِنْ بَعْدِهِمْ * وَالْقَائِمَ بِعَهْدِهِمْ * مَوْلَانَا وَإِمَامَ عَصْرِنَا * وَوَلِيَّ أَمْرِنَا الْإِمَامَ الطَّيِّبَ أَبَا الْقَاسِمِ أَمِيرَ الْمُؤْمِنِينَ * بِالصَّلَاةِ وَالسَّلَامِ عَلَيْهِ * وَعَلَى الْأَئِمَّةِ الْمَسْتُورِينَ مِنْ نَجْلِهِ * إِلَى إِمَامِ هَذَا الزَّمَانِ مِنْ نَجْلِهِ أَمِيرِ الْمُؤْمِنِينَ * وَعَلَى الْأَئِمَّةِ مِنْ نَسْلِهِ الْمُنْتَظَرِينَ إِلَى يَوْمِ الدِّينِ * اللَّهُمَّ انْصُرْ أَعْوَانَهُ وَأَظْهِرْ بُرْهَانَهُ * وَعَجِّلْ فَرَجَهُ بِنَصْرِكَ * وَأَهْلِكْ أَعْدَاءَهُ بِكَيْدِكَ وَمَكْرِكَ * فَإِنَّهُمْ يُرِيدُونَ أَنْ يُطْفِئُوا نُورَ اللَّهِ بِأَفْوَاهِهِمْ * وَيَأْبَى اللَّهُ إِلَّا أَنْ يُتِمَّ نُورَهُ وَلَوْ كَرِهَ الْكَافِرُونَ * اللَّهُمَّ ارْفَعْنَا بِهِ فِي عِلِّيِّينَ * وَاجْعَلْنَا مِنَ الْمُخْلِصِينَ * وَفِي طَاعَتِهِ مُجْتَهِدِينَ * وَبَارِكْ عَلَيْهِ وَعَلَى آلِهِ الطَّاهِرِينَ kki a'malana * wa sahhil amalana * wa hab lana afiyatan min kulli suqm * wa farajan min kulli hamm * ya khayral-wahibin * ya arhamar-rahimin *", "note": ""}], "notes": [], "finish": false}, {"phase": 1, "title": "Masjid Zaynab bint Jahsh", "lead": "Prayer and dua.", "actions": ["Pray two rak'at with this niyyah and read the dua after the salam.", "Then go to the place of dua near the mosque and read the second dua."], "duas": [{"title": "Niyyah for 2 rak'at", "ar": "أُصَلِّي صَلَاةَ اللَّجَإِ إِلَى اللَّهِ تَعَالَى رَكْعَتَيْنِ لِلَّهِ عَزَّ وَجَلَّ أَدَاءً مُسْتَقْبِلَ الْكَعْبَةِ الْحَرَامِ اللَّهُ أَكْبَرُ *", "tr": "Usalli salatal-laja'i ilallahi ta'ala rak'atayni lillahi azza wa jall ada'an mustaqbilal-ka'batil-haram Allahu akbar *", "note": "Pray two rak'at of Tahiyyat al-Masjid first, then these two rak'at."}, {"title": "Dua after the salam", "ar": "اللَّهُمَّ إِنْ تَشَأْ تَعْفُ عَنَّا فَبِفَضْلِكَ * وَإِنْ تَشَأْ تُعَذِّبْنَا فَبِعَدْلِكَ * وَسَهِّلْ لَنَا عَفْوَكَ بِمَنِّكَ * وَأَجِرْنَا مِنْ عَذَابِكَ بِتَجَاوُزِكَ * فَإِنَّهُ لَا طَاقَةَ لَنَا بِعَدْلِكَ * وَلَا نَجَاةَ لِأَحَدٍ مِنَّا دُونَ عَفْوِكَ * يَا غَنِيَّ الْأَغْنِيَاءِ هَا نَحْنُ عِبَادُكَ بَيْنَ يَدَيْكَ * وَأَنَا أَفْقَرُ الْفُقَرَاءِ إِلَيْكَ * فَاجْبُرْ فَاقَتَنَا بِوُسْعِكَ * وَلَا تَقْطَعْ رَجَاءَنَا بِمَنْعِكَ * فَتَكُونَ قَدْ أَشْقَيْتَ مَنِ اسْتَسْعَدَ بِكَ * وَحَرَمْتَ مَنِ اسْتَرْفَدَ فَضْلَكَ * فَإِلَى مَنْ حِينَئِذٍ مُنْقَلَبُنَا عَنْكَ * وَإِلَى أَيْنَ مَذْهَبُنَا عَنْ بَابِكَ * سُبْحَانَكَ نَحْنُ الْمُضْطَرُّونَ * الَّذِينَ أَوْجَبْتَ إِجَابَتَهُمْ * وَأَهْلُ السُّوءِ الَّذِينَ وَعَدْتَ الْكَشْفَ عَنْهُمْ * وَأَشْبَهُ الْأَشْيَاءِ بِمَشِيئَتِكَ * وَأَوْلَى الْأُمُورِ بِكَ فِي عَظَمَتِكَ * رَحْمَةُ مَنِ اسْتَرْحَمَكَ * وَغَوْثُ مَنِ اسْتَغَاثَ بِكَ * فَارْحَمْ تَضَرُّعَنَا إِلَيْكَ * وَأَغْنِنَا إِذْ طَرَحْنَا أَنْفُسَنَا بَيْنَ يَدَيْكَ * اللَّهُمَّ إِنَّ الشَّيْطَانَ قَدْ شَمَتَ بِنَا إِذْ شَايَعْنَاهُ عَلَى مَعْصِيَتِكَ * فَصَلِّ عَلَى مُحَمَّدٍ وَآلِهِ وَلَا تُشْمِتْهُ بِنَا بَعْدَ تَرْكِنَا إِيَّاهُ لَكَ * وَرَغْبَتِنَا عَنْهُ إِلَيْكَ * يَا أَرْحَمَ الرَّاحِمِينَ *", "tr": "Allahumma in tasha' ta'fu anna fabifadlik * wa in tasha' tu'adhdhibna fabi'adlik * wa sahhil lana afwaka bimannik * wa ajirna min adhabika bitajawuzik * fa-innahu la taqata lana bi'adlik * wa la najata li-ahadin minna duna afwik * ya ghaniyyal-aghniya'i ha nahnu ibaduka bayna yadayk * wa ana afqarul-fuqara'i ilayk * fajbur faqatana biwus'ik * wa la taqta' raja'ana bimanik * fatakuna qad ashqayta manistas'adabik * wa harimta manistarfada fadlak * fa-ila man hina'idhin munqalabuna anka * wa ila ayna madhhabuna an babik * subhanaka nahnul-mudtarrun * alladhina awjabta ijabatahum * wa ahlus-su'il-ladhina wa'adtal-kashfa anhum * wa ashbahul-ashya'i bimashi'atik * wa awlal-umuri bika fi azamatik * rahmatu manistarhamak * wa ghawthu manistaghatha bik * farham tadarru'ana ilayk * wa aghnina idh tarahna anfusana bayna yadayk * Allahumma innash-shaytana qad shamita bina idh shaya'nahu ala ma'siyatik * fa-salli ala Muhammadin wa alihi wa la tushmithu bina ba'da tarkina iyyahu lak * wa raghbatina anhu ilayk * ya arhamar-rahimin *", "note": ""}, {"title": "Dua at the place of dua near the mosque", "ar": "اللَّهُمَّ إِنَّكَ حَاضِرٌ لَا تَغِيبُ * وَحَيٌّ لَا تَمُوتُ * وَغَنِيٌّ لَا تَفْتَقِرُ * وَعَزِيزٌ لَا تَذِلُّ * وَدَائِمٌ لَا تَنْفَدُ * وَعَالِمٌ لَا تَجْهَلُ * وَقَدِيرٌ لَا تُغْلَبُ * فَاهْدِنَا بِهُدَاكَ * وَخُذْ بِنَوَاصِينَا إِلَى رِضَاكَ * اللَّهُمَّ لَا تُخَيِّبْ رَجَاءَنَا فِي الرَّاجِينَ * وَلَا تَرُدَّ دُعَاءَنَا فِي الدَّاعِينَ * وَأَعِذْنَا مِنْ كَيْدِ الْكَائِدِينَ * وَحَسَدِ الْحَاسِدِينَ * وَعَدَاوَةِ الْمُعَادِينَ * وَارْفَعْ ذِكْرَنَا * وَمَهِّدْ أَمْرَنَا * ذَلَّ لَكَ الْجَبَّارُونَ * وَخَضَعَ لَكَ الْمُتَكَبِّرُونَ * يَا دَائِمَ الْبَقَاءِ * وَيَا وَاسِعَ الْعَطَاءِ * هَبْ لَنَا مَا لَا يَنْفَعُكَ * وَاغْفِرْ لَنَا مَا لَا يَضُرُّكَ * وَأَعِذْنَا مِنْ سَخَطِكَ وَسُخْطِ أَوْلِيَائِكَ * وَلَا تَبْتَلِنَا بِشَرِّ بَلَائِكَ * فَأَنْتَ الرَّحِيمُ الرَّؤُوفُ * الْوَدُودُ اللَّطِيفُ *", "tr": "Allahumma innaka hadirun la taghib * wa hayyun la tamut * wa ghaniyyun la taftaqir * wa azizun la tadhill * wa da'imun la tanfad * wa alimun la tajhal * wa qadirun la tughlab * fahdina bihudak * wa khudh binawasina ila ridak * Allahumma la tukhayyib raja'ana fir-rajin * wa la tarudda du'a'ana fid-da'in * wa a'idhna min kaydil-ka'idin * wa hasadil-hasidin * wa adawatil-mu'adin * warfa' dhikrana * wa mahhid amrana * dhalla lakal-jabbarun * wa khada'a lakal-mutakabbirun * ya da'imal-baqa' * wa ya wasi'al-ata' * hab lana ma la yanfa'uk * waghfir lana ma la yadurruk * wa a'idhna min sakhatika wa sukhti awliya'ik * wa la tabtalina bisharri bala'ik * fa-antar-rahimur-ra'ufu * al-wadudul-latif *", "note": ""}], "notes": [], "finish": false}, {"phase": 2, "title": "Masjid al-Fadikh", "lead": "Currently demolished.", "actions": ["Pray two rak'at with this niyyah and read the dua, if you can reach the place."], "duas": [{"title": "Niyyah for 2 rak'at", "ar": "أُصَلِّي صَلَاةً لِطَلَبِ الزُّهْدِ مِنَ اللَّهِ تَعَالَى رَكْعَتَيْنِ لِلَّهِ عَزَّ وَجَلَّ أَدَاءً مُسْتَقْبِلَ الْكَعْبَةِ الْحَرَامِ اللَّهُ أَكْبَرُ *", "tr": "Usalli salatan litalabiz-zuhdi minallahi ta'ala rak'atayni lillahi azza wa jall ada'an mustaqbilal-ka'batil-haram Allahu akbar *", "note": "The booklet notes that this mosque is currently demolished, so go there only if possible. The booklet notes that this mosque is currently demolished, so go there only if possible."}, {"title": "Dua after the salam", "ar": "إِلَهِي أَسْكَنْتَنَا دَارًا حَفَرْتَ لَنَا حُفَرَ مَكْرِهَا * وَعَلَّقْتَنَا بِأَيْدِي الْمَنَايَا فِي حَبَائِلِ غَدْرِهَا * فَإِلَيْكَ نَلْتَجِئُ مِنْ مَكَائِدِ خُدَعِهَا * وَبِكَ نَعْتَصِمُ مِنَ الِاغْتِرَارِ بِزَخَارِفِ زِينَتِهَا * فَإِنَّهَا الْمُهْلِكَةُ طُلَّابَهَا * الْمُتْلِفَةُ حُلَّالَهَا * الْمَحْشُوَّةِ بِالْآفَاتِ * الْمَشْحُونَةِ بِالنَّكَبَاتِ * إِلَهِي فَزَهِّدْنَا فِيهَا وَسَلِّمْنَا مِنْهَا بِتَوْفِيقِكَ وَعِصْمَتِكَ * وَانْزِعْ عَنَّا جَلَابِيبَ مُخَالَفَتِكَ * وَتَوَلَّ أُمُورَنَا بِحُسْنِ كِفَايَتِكَ * وَأَوْفِرْ مَزِيدَنَا مِنْ سَعَةِ رَحْمَتِكَ * وَأَجْزِلْ صِلَاتِنَا مِنْ فَيْضِ مَوَاهِبِكَ * وَاغْرِسْ فِي أَفْئِدَتِنَا أَشْجَارَ مَحَبَّتِكَ * وَأَتْمِمْ لَنَا أَنْوَارَ مَعْرِفَتِكَ * وَأَذِقْنَا حَلَاوَةَ عَفْوِكَ * وَلَذَّةَ مَغْفِرَتِكَ * وَأَقْرِرْ أَعْيُنَنَا يَوْمَ لِقَائِكَ بِرُؤْيَتِكَ * وَأَخْرِجْ حُبَّ الدُّنْيَا مِنْ قُلُوبِنَا كَمَا فَعَلْتَ بِالصَّالِحِينَ مِنْ صَفْوَتِكَ * وَالْأَبْرَارِ مِنْ خَاصَّتِكَ * بِرَحْمَتِكَ يَا أَرْحَمَ الرَّاحِمِينَ * وَيَا أَكْرَمَ الْأَكْرَمِينَ *", "tr": "Ilahi askantana daran hafarta lana hufara makriha * wa allaqtana bi-aydil-manaya fi haba'ili ghadriha * fa-ilayka naltaji'u min maka'idi khuda'iha * wa bika na'tasimu minal-ightirari bizakharifi zinatiha * fa-innahal-muhlikatu tullabaha * al-mutlifatu hullaliha * al-mahshuwwati bil-afat * al-mashhunati bin-nakabat * Ilahi fa-zahhidna fiha wa sallimna minha bitawfiqika wa ismatik * wan-zi' anna jalabiba mukhalafatik * wa tawalla umurana bihusni kifayatik * wa awfir mazidana min sa'ati rahmatik * wa ajzil silatina min faydi mawahibik * waghris fi af'idatina ashjara mahabbatik * wa atmim lana anwara ma'rifatik * wa adhiqna halawata afwik * wa ladhdhata maghfiratik * wa aqrir a'yunana yawma liqa'ika biru'yatik * wa akhrij hubbad-dunya min qulubina kama fa'alta bis-salihina min safwatik * wal-abrari min khassatik * birahmatika ya arhamar-rahimin * wa ya akramal-akramin *", "note": ""}], "notes": [], "finish": false}, {"phase": 2, "title": "Masjid Mashraba Umm Ibrahim", "lead": "Currently demolished.", "actions": ["Pray two rak'at with this niyyah and read the dua, if you can reach the place."], "duas": [{"title": "Niyyah for 2 rak'at", "ar": "أُصَلِّي صَلَاةً لِطَلَبِ الْمَغْفِرَةِ مِنَ اللَّهِ تَعَالَى رَكْعَتَيْنِ لِلَّهِ عَزَّ وَجَلَّ أَدَاءً مُسْتَقْبِلَ الْكَعْبَةِ الْحَرَامِ اللَّهُ أَكْبَرُ *", "tr": "Usalli salatan litalabil-maghfirati minallahi ta'ala rak'atayni lillahi azza wa jall ada'an mustaqbilal-ka'batil َنَاتِ * يَا غَافِرَ السَّيِّئَاتِ * يَا عَالِمَ الْخَفِيَّاتِ * يَا مُفَرِّجَ الْكُرُبَاتِ * يَا سَرِيعَ الْحِسَابِ * يَا شَدِيدَ الْعِقَابِ * يَا فَاتِحَ الْأَبْوَابِ * يَا مُجْزِلَ الثَّوَابِ * نَسْأَلُكَ يَا رَبِّ بِنُورِكَ الْعَظِيمِ * وَمَنِّكَ الْجَسِيمِ * وَصِرَاطِكَ الْمُسْتَقِيمِ * الْهُدَى وَالْيَقِينَ * وَالسَّلَامَةَ فِي الدِّينِ * وَنَسْأَلُكَ قُلُوبًا لِأَمْرِكَ وَاعِيَةً * وَأَقْدَامًا فِي مَرْضَاتِكَ سَاعِيَةً * وَأَجْسَادًا لِطَاعَتِكَ مُرَاعِيَةً * وَنُفُوسًا إِلَى مَا أَرْضَاكَ دَاعِيَةً * اللَّهُمَّ اغْفِرْ لَنَا مَا تَقَدَّمَ مِنْ ذُنُوبِنَا * وَاعْصِمْنَا فِيمَا تَأَخَّرَ أَنْ نَرْكَبَ نَهْيَكَ * أَوْ نَعْصِيَ أَمْرَكَ * أَوْ نُؤَلِّفَ أَعْدَاءَكَ * أَوْ نُخَالِفَ مَوَالِيَكَ * أَوْ نُعِينَ ظَالِمًا * أَوْ نَخْذُلَ مَلْهُوفًا * وَأَنْ يَسُوءَ ظَنُّنَا بِكَ * وَأَنْ تُشْمِتَ بِنَا أَعْدَاءَنَا * وَقَدْ تَمَسَّكْنَا بِسَبَبِكَ * وَنَعُوذُ بِكَ مِنْ أَحْدَاثِ الزَّمَانِ وَتَصَرُّفِ الْحِدْثَانِ * وَأَنْ نَعُودَ بَعْدَ الزِّيَادَةِ إِلَى النُّقْصَانِ * اللَّهُمَّ إِنَّا نَعُوذُ بِكَ مِنَ الْحَوْرِ بَعْدَ الْكَوْرِ * وَنَسْأَلُكَ خَيْرًا إِلَى خَيْرٍ * اللَّهُمَّ اهْدِنَا فَمَا ضَلَّ مَنْ هَدَيْتَ * اللَّهُمَّ أَغْنِنَا فَمَا افْتَقَرَ مَنْ أَغْنَيْتَ * اللَّهُمَّ عَافِنَا فَمَا سَقِمَ مَنْ عَافَيْتَ * إِنَّهُ لَا يَعِزُّ مَنْ عَادَيْتَ * وَلَا يَذِلُّ مَنْ وَالَيْتَ * اللَّهُمَّ اجْعَلْنَا مِنَ الصَّابِرِينَ عَلَى بَلَائِكَ * وَالرَّاضِينَ بِقَضَائِكَ * وَالشَّاكِرِينَ عَلَى نَعْمَائِكَ * بِرَحْمَتِكَ وَمَنِّكَ وَآلَائِكَ * إِنَّكَ أَنْتَ أَرْحَمُ الرَّاحِمِينَ * وَآخِرُ دَعْوَانَا أَنِ الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ *", "tr": "Allahumma inna hadha mawqifun min mawaqifi nabiyyika Muhammadin sallallahu alayhi wa ala alihi wa sallam * allati kana yad'uka fiha * wa yatadarra'u ilayka indaha * wa nahnu nad'uka ya rabbi wa natadarra'u ilayk * wa natawajjahu ilayka binabiyyika Muhammadin wa alihi fa-salli ya rabbi ala Muhammadin wa ala ali Muhammadin afdala salawatik * wa khussahu bi-azka barakatik * wab'athhu fil-maqamil-mahmudil-ladhi wa'adtah r 2 rak'at", "ar": "أُصَلِّي صَلَاةً لِطَلَبِ الْفَتْحِ الْمُبِينِ رَكْعَتَيْنِ لِلَّهِ عَزَّ وَجَلَّ أَدَاءً مُسْتَقْبِلَ الْكَعْبَةِ الْحَرَامِ اللَّهُ أَكْبَرُ *", "tr": "Usalli salatan litalabil-fathil-mubini rak'atayni lillahi azza wa jall ada'an mustaqbilal-ka'batil-haram Allahu akbar *", "note": "Pray two rak'at of Tahiyyat al-Masjid first, then these two rak'at."}, {"title": "Dua after the salam", "ar": "يَا صَرِيخَ الْمَكْرُوبِينَ * يَا مُجِيبَ دَعْوَةِ الْمُضْطَرِّينَ * اكْشِفْ كَرْبِي وَهَمِّي * كَمَا كَشَفْتَ عَنْ نَبِيِّكَ كَرْبَهُ وَهَمَّهُ وَغَمَّهُ * وَكَفَيْتَهُ هَمَّ عَدُوِّهِ * اللَّهُمَّ أَعْطِنِي إِيمَانًا صَادِقًا لَا كُفْرَ بَعْدَهُ * وَرَحْمَةً آمَنُ فِيهَا شَرَّ الْآخِرَةِ * وَأَنَالُ بِهَا خَيْرَ الدُّنْيَا يَا أَرْحَمَ الرَّاحِمِينَ *", "tr": "Ya sarikhal-makrubin * ya mujiba da'watil-mudtarrin * ikshif karbi wa hammi * kama kashafta an nabiyyika karbahu wa hammahu wa ghammah * wa kafaytahu hamma aduwwih * Allahumma a'tini imanan sadiqan la kufra ba'dah * wa rahmatan amanu fiha sharral-akhirah * wa analu biha khayrad-dunya ya arhamar-rahimin *", "note": "Some words were hard to read in the original scan. Check this against your booklet."}, {"title": "Verses to read 7 times", "ar": "وَكَفَى بِاللَّهِ وَلِيًّا * وَكَفَى بِاللَّهِ نَصِيرًا * وَكَفَى بِاللَّهِ حَسِيبًا * وَكَفَى بِاللَّهِ وَكِيلًا * وَكَفَى بِرَبِّكَ هَادِيًا وَنَصِيرًا * وَكَفَى بِرَبِّكَ بِذُنُوبِ عِبَادِهِ خَبِيرًا بَصِيرًا * وَكَفَى اللَّهُ الْمُؤْمِنِينَ الْقِتَالَ وَكَانَ اللَّهُ قَوِيًّا عَزِيزًا *", "tr": "wa kafa billahi waliyya * wa kafa billahi nasira * wa kafa billahi hasiba * wa kafa billahi wakila * wa kafa birabbika hadiyan wa nasira * wa kafa birabbika bidhunubi ibadihi khabiran basira * wa kafallahul-mu'mininal-qitala wa kanallahu qawiyyan aziza *", "note": ""}, {"title": "Dua after the verses", "ar": "لَا إِلَهَ إِلَّا اللَّهُ * وَحْدَهُ لَا شَرِيكَ لَهُ * لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ بِيَدِهِ الْخَيْرُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ * لَا إِلَهَ إِلَّا ّا سَلَفَ * وَاعْصِمْنَا فِي الْمُؤْتَنَفِ * وَاسْتُرْ عَلَيْنَا وَعَلَى أَهْلِينَا وَأَوْلَادِنَا * وَلَا تُشْمِتْ بِنَا حَاسِدًا * وَلَا تُسَلِّطْ عَلَيْنَا عَدُوًّا لَا يَرْحَمُنَا * يَا أَرْحَمَ الرَّاحِمِينَ * اللَّهُمَّ ارْزُقْنَا الْجِدَّ وَالِاجْتِهَادَ فِي عِبَادَتِكَ * وَالْغَزْوَ وَالرِّبَاطَ فِي طَاعَتِكَ * وَصِدْقَ النِّيَّةِ وَالْخُضُوعَ * وَالتَّوْبَةَ وَالْوَجَلَ مِنْكَ * وَالرَّجَاءَ إِلَيْكَ وَالثِّقَةَ بِكَ * وَالتَّوَكُّلَ عَلَيْكَ وَالتَّوَرُّعَ عَنْ مَحَارِمِكَ * وَصَالِحَ الْقَوْلِ * وَمَقْبُولَ السَّعْيِ * وَمُسْتَجَابَ الدُّعَاءِ * وَلَا تَحُلْ بَيْنَنَا وَبَيْنَ ذَلِكَ بِعَرَضٍ وَلَا مَرَضٍ وَلَا حَزَنٍ * اللَّهُمَّ مَنْ كَانَ مِمَّنْ حَضَرَ هَذَا الْمَوْقِفَ تَائِبًا فَاقْبَلْ تَوْبَتَهُ * وَمَنْ كَانَ مُذْنِبًا فَاغْفِرْ ذَنْبَهُ * وَمَنْ كَانَ فَقِيرًا فَاجْبُرْ فَقْرَهُ * وَمَنْ كَانَ مَدْيُونًا فَاقْضِ دَيْنَهُ * وَمَغْمُومًا فَأَذْهِبْ غَمَّهُ * أَوْ مَكْرُوبًا فَفَرِّجْ كَرْبَهُ * وَمَنْ كَانَ خَائِفًا فَأَمِّنْ خَوْفَهُ * أَوْ مُحْتَاجًا فَاقْضِ حَاجَتَهُ * أَوْ طَالِبَ وَلَدٍ فَهَبْ لَهُ طَلِبَتَهُ * أَوْ زَوْجَةٍ فَزَوِّجْهُ * وَأَحْسِنْ مَعُونَتَهُ * اللَّهُمَّ اقْضِ لِكُلِّ ذِي حَاجَةٍ مِنَّا وَمِنْ جَمِيعِ الْمُسْلِمِينَ حَاجَتَهُ * وَأَنْجِزْ لَنَا آمَالَنَا وَآمَالَهُمْ * وَأَنْجِحْ سُؤْلَنَا وَسُؤْلَهُمْ * وَشَفِّعْ نَبِيَّكَ مُحَمَّدًا صَلَّى اللَّهُ عَلَيْهِ وَعَلَى آلِهِ فِينَا وَفِيهِمْ * وَلَا تَرُدَّنَا وَإِيَّاهُمْ خَائِبِينَ * وَلَا مَقْبُوحِينَ * بِرَحْمَتِكَ يَا أَرْحَمَ الرَّاحِمِينَ * اللَّهُمَّ وَمِنْ إِخْوَانِنَا الَّذِينَ خَلَّفْنَاهُمْ مَنْ يُحِبُّ مِثْلَ مَا أَحْبَبْنَا مِنَ الزِّيَارَةِ لِنَبِيِّنَا صَلَّى اللَّهُ عَلَيْهِ وَعَلَى آلِهِ وَالْحُضُورِ لِمَشَاهِدِهِ * مَعَ حَجِّ بَيْتِكَ الْحَرَامِ * وَالْقِيَامِ بِمَنَاسِكِكَ الْعِظَامِ * فَسَهِّلْ ذَلِكَ لَهُمْ * وَبَلِّغْهُمْ فِيهِ أَمَلَهُمْ * وَافْتَحْ لَنَا وَلَهُمْ مِنْ فَضْلِكَ مَا نَسْتَغْنِي بِهِ عَمَّنْ سِوَاكَ مِنْ خَلْقِكَ * اللَّهُمَّ لَا تَجْعَلْهُ آخِرَ الْعَهْدِ مِنْ هَذِهِ الْمَوَاقِفِ الشَّرِيفَةِ وَالْمَشَاهِدِ الزَّلِيفَةِ * وَارْزُقْنَا الْعَوْدَةَ إِلَيْهَا فِي كُلِّ عَامٍ أَبَدًا مَا أَحْيَيْتَنَا * إِنَّكَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ * وَذَلِكَ عَلَيْكَ يَسِيرٌ * اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ عَبْدِكَ وَرَسُولِكَ وَنَبِيِّكَ وَصَفِيِّكَ وَحَبِيبِكَ وَخَاصَّتِكَ وَخَالِصَتِكَ وَخِيرَتِكَ مِنْ خَلْقِكَ * وَصَفْوَتِكَ مِنْ جَمِيعِ بَرِيَّتِكَ * اللَّهُمَّ فَصَلِّ عَلَى نَبِيٍّ بِهِ مِنَ الضَّلَالَةِ هَدَيْتَنَا * وَرَسُولٍ بِهِ مِنَ الْجَهَالَةِ عَلَّمْتَنَا * وَرَؤُوفٍ بِهِ مِنَ الْعَمَايَةِ بَصَّرْتَنَا * وَرَحِيمٍ بِهِ مِنْ شَفَا جُرُفٍ أَنْقَذْتَنَا * وَخَاتِمٍ بِهِ مِنَ الزَّيْغِ أَخْرَجْتَنَا * وَجَعَلْتَنَا بِهِ خَيْرَ أُمَّةٍ أُخْرِجَتْ لِلنَّاسِ * وَشَرَّفْتَنَا بِهِ وَأَكْرَمْتَنَا * وَجَعَلْتَنَا بِهِ شُهَدَاءَ عَلَى النَّاسِ فَأَزْلَفْتَنَا * فَإِنَّكَ مَشْكُورٌ يَا مَوْلَانَا عَلَى مَا مَنَنْتَ بِهِ مِنْ ذَلِكَ وَأَوْلَيْتَنَا * فَصَلِّ اللَّهُمَّ يَا قَيُّومُ عَلَى نَبِيِّنَا وَإِمَامِنَا وَمُشَرِّفِنَا وَشَافِعِنَا وَوَلِيِّنَا وَوَسِيلَتِنَا مُحَمَّدٍ الْبَشِيرِ * وَخِيرَتِكَ النَّذِيرِ * وَصَفْوَتِكَ الْعَاقِبِ فِي أَرْضِكَ الْأَثِيرِ * أَسْنَى وَأَحْظَى وَأَكْثَرَ وَأَرْضَى وَأَنْضَرَ * وَأَزْكَى وَأَكْبَرَ * وَأَعْلَى وَأَفْخَرَ * وَأَنْمَى وَأَوْفَرَ * مَا صَلَّيْتَ عَلَى أَحَدٍ مِنْ خَلْقِكَ * الْحَافِّينَ بِعَرْشِكَ * وَالْمُسَبِّحِينَ بِقُدْسِكَ * الدَّائِبِينَ بِمَلَكُوتِكَ * لَدَى كُرْسِيِّكَ وَطَبَقَاتِ مَلَائِكَتِكَ مِنَ الْكَرُوبِيِّينَ وَالرُّوحَانِيِّينَ * وَمَنْ عَلِمْتَ وَجَهِلْنَا * وَأَحْصَيْتَ وَنَسِينَا * مِنَ الَّذِينَ أَكْرَمْتَهُمْ عِنْدَكَ بِالْقُرْبَةِ * وَفَضَّلْتَهُمْ بِالْعِصْمَةِ * وَأَزْلَفْتَهُمْ لَدَيْكَ بِالتَّقْدِمَةِ * وَصَلِّ يَا رَبِّ عَلَى أَنْبِيَائِكَ وَنُظَرَائِكَ * وَعَلَى مَنِ ارْتَضَيْتَ وَجَمَّلْتَ وَأَحْبَبْتَ وَأَرْشَدْتَ وَهَدَيْتَ وَاجْتَبَيْتَ مِنْ سُلَالَتِهِ الْمُطَهَّرِينَ * وَعِتْرَتِهِ الطَّيِّبِينَ * وَذُرِّيَّتِهِ الْمُصْطَفَيْنَ * وَصَلِّ يَا رَبِّ عَلَى مَلَائِكَتِكَ الْمُقَرَّبِينَ * وَأَنْبِيَائِكَ الْمُرْسَلِينَ * وَأَهْلِ طَاعَتِكَ أَجْمَعِينَ مِنْ سُكَّانِ السَّمَوَاتِ وَالْأَرَضِينَ * وَسَلِّمْ عَلَيْهِمْ تَسْلِيمًا ك  was broken", "ar": "بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ\nاللَّهُمَّ وَأَتْبَاعُ الرُّسُلِ وَمُصَدِّقُوهُمْ مِنْ أَهْلِ الْأَرْضِ بِالْغَيْبِ عِنْدَ مُعَارَضَةِ الْمُعَانِدِينَ لَهُمْ بِالتَّكْذِيبِ * وَالِاشْتِيَاقِ إِلَى الْمُرْسَلِينَ بِحَقَائِقِ الْإِيمَانِ * فِي كُلِّ دَهْرٍ وَزَمَانٍ * أَرْسَلْتَ فِيهِ رَسُولًا * وَأَقَمْتَ لِأَهْلِهِ دَلِيلًا * مِنْ لَدُنْ آدَمَ عَلَيْهِ السَّلَامُ إِلَى مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَآلِهِ مِنْ أَئِمَّةِ الْهُدَى * وَقَادَةِ أَهْلِ التُّقَى * عَلَى جَمِيعِهِمُ السَّلَامُ * فَاذْكُرْهُمْ مِنْكَ بِمَغْفِرَةٍ وَرِضْوَانٍ * اللَّهُمَّ وَأَصْحَابُ مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَآلِهِ خَاصَّةً * الَّذِينَ أَحْسَنُوا الصَّحَابَةَ * وَالَّذِينَ أَبْلَوُا الْبَلَاءَ الْحَسَنَ فِي نَصْرِهِ * وَكَانَفُوهُ وَأَسْرَعُوا إِلَى وِفَادَتِهِ * وَسَابَقُوا إِلَى دَعْوَتِهِ * وَاسْتَجَابُوا لَهُ حَيْثُ أَسْمَعَهُمْ حُجَّةَ رِسَالَاتِهِ * وَفَارَقُوا الْأَزْوَاجَ وَالْأَوْلَادَ فِي إِظْهَارِ كَلِمَتِهِ * وَقَاتَلُوا الْآبَاءَ وَالْأَبْنَاءَ فِي تَثْبِيتِ نُبُوَّتِهِ * وَانْتَصَرُوا بِهِ * وَمَنْ كَانُوا مُنْطَوِينَ عَلَى مَحَبَّتِهِ * يَرْجُونَ تِجَارَةً لَنْ تَبُورَ فِي مَوَدَّتِهِ * وَالَّذِينَ هَجَرَتْهُمُ الْعَشَائِرُ إِذْ تَعَلَّقُوا بِعُرْوَتِهِ * وَانْتَفَتْ مِنْهُمُ الْقَرَابَاتُ إِذْ سَكَنُوا فِي ظِلِّ قَرَابَتِهِ * فَلَا تَنْسَ لَهُمُ اللَّهُمَّ مَا تَرَكُوا لَكَ وَفِيكَ * وَأَرْضِهِمْ مِنْ رِضْوَانِكَ * وَبِمَا حَاشُوا الْخَلْقَ عَلَيْكَ * وَكَانُوا مَعَ رَسُولِكَ دُعَاةً لَكَ إِلَيْكَ * وَاشْكُرْهُمْ عَلَى هَجْرِهِمْ فِيكَ دِيَارَ قَوْمِهِمْ * وَخُرُوجِهِمْ مِنْ سَعَةِ الْمَعَاشِ إِلَى ضِيقِهِ * وَمَنْ كَثَّرْتَ فِي إِعْزَازِ دِينِكَ مِنْ مَظْلُومِهِمْ * اللَّهُمَّ وَأَوْصِلْ إِلَى التَّابِعِينَ لَهُمْ بِإِحْسَانٍ الَّذِينَ يَقُولُونَ رَبَّنَا اغْفِرْ لَنَا وَلِإِخْوَانِنَا الَّذِينَ سَبَقُونَا بِالْإِيمَانِ خَيْرَ جَزَائِكَ * الَّذِينَ قَصَدُوا سَمْتَهُمْ * وَتَحَرَّوْا وِجْهَتَهُمْ * وَمَضَوْا عَلَى شَاكِلَتِهِمْ * لَمْ يَثْنِهِمْ رَيْبٌ فِي بَصِيرَتِهِمْ وَلَمْ يَخْتَلِجْهُمْ شَكٌّ فِي قَفْوِ آثَارِهِمْ * وَالِائْتِمَ
